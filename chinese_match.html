    * { -webkit-tap-highlight-color: transparent; }

    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    nav.fixed[class*="bottom-"] {
      bottom: max(12px, calc(10px + env(safe-area-inset-bottom, 0px))) !important;
    }

      font-family: 'Ma Shan Zheng', 'KaiTi', '楷体', 'STKaiti', serif !important;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 3D Card Flip Mechanics */
    .perspective-1000 {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .card-flipped {
      transform: rotateY(180deg);
    }
    .card-matched {
      transform: rotateY(180deg) scale(0.96);
      opacity: 0.85;
      pointer-events: none;
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1.25rem;
    }
    .card-front {
      background: linear-gradient(135deg, #FF6B6B 0%, #EE5253 100%);
      box-shadow: 0 4px 12px rgba(238, 82, 83, 0.25);
    }
    .card-back {
      background: #FFFFFF;
      transform: rotateY(180deg);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      border: 2px solid #FED7D7;
    }
    @keyframes bounceGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .animate-match {
      animation: bounceGlow 0.5s ease-out;
    }

          { zh: '四', py: 'sì', th: 'สี่ (4)', icon: '4️⃣' },
          { zh: '五', py: 'wǔ', th: 'ห้า (5)', icon: '5️⃣' },

          { zh: '蓝', py: 'lán', th: 'สีฟ้า/น้ำเงิน', icon: '🔵' },

        icon: '👨‍👩‍👧',
        pairs: [
          { zh: '爸爸', py: 'bàba', th: 'คุณพ่อ', icon: '👨' },
          { zh: '妈妈', py: 'māma', th: 'คุณแม่', icon: '👩' },
          { zh: '哥哥', py: 'gēge', th: 'พี่ชาย', icon: '👦' },
          { zh: '妹妹', py: 'mèimei', th: 'น้องสาว', icon: '👧' },
          { zh: '眼睛', py: 'yǎnjing', th: 'ดวงตา', icon: '👀' },
          { zh: '口', py: 'kǒu', th: 'ปาก', icon: '👄' },
          { zh: '手', py: 'shǒu', th: 'มือ', icon: '✋' },
          { zh: '耳朵', py: 'ěrduo', th: 'ใบหู', icon: '👂' }
        ]
      }
    ];

    // 2. GAME STATE
    let currentCategoryIndex = 0;
    let difficulty = 'easy'; // 'easy' (4 pairs), 'medium' (6 pairs), 'hard' (8 pairs)
    let activeCards = [];
    let flippedCards = [];
    let matchedCount = 0;
    let isProcessing = false;
    let userStars = parseInt(localStorage.getItem('KB_STARS') || '0', 10);

    // 3. SYNTHETIC AUDIO & SPEECH
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;

    function playTone(freq, duration, type = 'sine') {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playCardFlipSfx() {
      playTone(480, 0.08, 'sine');
    }

    function playMatchSfx() {
      playTone(523.25, 0.1, 'triangle'); // C5
      setTimeout(() => playTone(659.25, 0.12, 'triangle'), 90); // E5
      setTimeout(() => playTone(783.99, 0.22, 'triangle'), 180); // G5
    }

    function playMismatchSfx() {
      playTone(320, 0.15, 'sawtooth');
      setTimeout(() => playTone(280, 0.2, 'sawtooth'), 120);
    }

    function speakChineseWord(text, pinyin, thaiMeaning) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = 'zh-CN';
      ut.rate = 0.85;
      ut.pitch = 1.05;
      window.speechSynthesis.speak(ut);
    }

    // 4. CATEGORY & DIFFICULTY CONTROLS
    function renderCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      container.innerHTML = MATCH_DATA.map((cat, idx) => {
        const isActive = (idx === currentCategoryIndex);
        return `
          <button onclick="selectCategory(${idx})" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-black transition active:scale-95 flex items-center gap-1.5 border ${isActive ? 'bg-red-500 text-white border-red-600 shadow-sm' : 'bg-white hover:bg-rose-50 text-slate-700 border-rose-100'}">
            <span>${cat.icon}</span>
            <span>${cat.name.split(' ')[0]}</span>
          </button>
        `;
      }).join('');
    }

    function selectCategory(idx) {
      currentCategoryIndex = idx;
      renderCategoryTabs();
      restartGame();
    }

    function nextCategory() {
      closeWinModal();
      currentCategoryIndex = (currentCategoryIndex + 1) % MATCH_DATA.length;
      renderCategoryTabs();
      restartGame();
    }

    function setDifficulty(diff) {
      difficulty = diff;
      document.getElementById('btnDiffEasy').className = 'px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 transition active:scale-95';
      document.getElementById('btnDiffMedium').className = 'px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 transition active:scale-95';
      document.getElementById('btnDiffHard').className = 'px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 transition active:scale-95';

      if (diff === 'easy') {
        document.getElementById('btnDiffEasy').className = 'px-2.5 py-1 rounded-lg text-xs font-black transition active:scale-95 bg-white text-red-600 shadow-xs';
      } else if (diff === 'medium') {
        document.getElementById('btnDiffMedium').className = 'px-2.5 py-1 rounded-lg text-xs font-black transition active:scale-95 bg-white text-red-600 shadow-xs';
      } else {
        document.getElementById('btnDiffHard').className = 'px-2.5 py-1 rounded-lg text-xs font-black transition active:scale-95 bg-white text-red-600 shadow-xs';
      }
      restartGame();
    }

    // 5. GAME ENGINE: CARDS GENERATION & SHUFFLE
    function restartGame() {
      flippedCards = [];
      matchedCount = 0;
      isProcessing = false;

      const numPairs = (difficulty === 'easy' ? 4 : difficulty === 'medium' ? 6 : 8);
      document.getElementById('totalMatches').textContent = numPairs;
      document.getElementById('matchesFound').textContent = 0;
      document.getElementById('praiseBanner').innerHTML = `💡 แตะเปิดการ์ดเพื่อจับคู่ "ตัวอักษรจีน" กับ "ภาพความหมาย" นะคะ`;

      const cat = MATCH_DATA[currentCategoryIndex];
      // Pick random pairs from category
      const shuffledPairs = [...cat.pairs].sort(() => Math.random() - 0.5).slice(0, numPairs);

      // Generate Card A (Chinese Character + Pinyin) and Card B (Icon + Thai)
      activeCards = [];
      shuffledPairs.forEach((p, idx) => {
        // Card Type A: Chinese
        activeCards.push({
          uid: `a_${idx}`,
          pairId: idx,
          type: 'chinese',
          word: p.zh,
          pinyin: p.py,
          meaning: p.th,
          icon: p.icon
        });
        // Card Type B: Picture
        activeCards.push({
          uid: `b_${idx}`,
          pairId: idx,
          type: 'picture',
          word: p.zh,
          pinyin: p.py,
          meaning: p.th,
          icon: p.icon
        });
      });

      // Shuffle all cards
      activeCards.sort(() => Math.random() - 0.5);

      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const numCols = activeCards.length <= 8 ? 'grid-cols-4' : (activeCards.length <= 12 ? 'grid-cols-3 sm:grid-cols-4' : 'grid-cols-4');
      grid.className = `grid ${numCols} gap-2.5 sm:gap-3 flex-1 items-center justify-center`;

      grid.innerHTML = activeCards.map((card, idx) => {
        return `
          <div class="perspective-1000 w-full h-24 sm:h-28" onclick="onCardClick(${idx})">
            <div id="card_${idx}" class="card-inner">
              <!-- Card Front (Cover) -->
              <div class="card-front flex flex-col items-center justify-center p-2 text-white">
                <span class="text-2xl sm:text-3xl opacity-80 select-none">🐼</span>
                <span class="text-[9px] font-bold text-white/90 uppercase tracking-widest mt-0.5">Kidobits</span>
              </div>
              <!-- Card Back (Content) -->
              <div class="card-back flex flex-col items-center justify-center p-2 select-none">
                ${card.type === 'chinese' ? `
                  <span class="text-3xl sm:text-4xl font-brush text-red-600 leading-none">${card.word}</span>
                  <span class="text-[11px] font-black text-slate-700 mt-1">${card.pinyin}</span>
                ` : `
                  <span class="text-3xl sm:text-4xl leading-none">${card.icon}</span>
                  <span class="text-[10.5px] font-bold text-slate-700 mt-1 truncate max-w-full px-1">${card.meaning}</span>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 6. CARD CLICK & MATCH EVALUATION
    function onCardClick(index) {
      if (isProcessing) return;
      const cardEl = document.getElementById(`card_${index}`);
      if (!cardEl || cardEl.classList.contains('card-flipped') || cardEl.classList.contains('card-matched')) return;

      playCardFlipSfx();
      cardEl.classList.add('card-flipped');
      flippedCards.push({ index, card: activeCards[index], el: cardEl });

      // Speak card if it's Chinese
      if (activeCards[index].type === 'chinese') {
        speakChineseWord(activeCards[index].word, activeCards[index].pinyin, activeCards[index].meaning);
      }

      if (flippedCards.length === 2) {
        evaluatePair();
      }
    }

    function evaluatePair() {
      isProcessing = true;
      const [first, second] = flippedCards;

      if (first.card.pairId === second.card.pairId && first.card.type !== second.card.type) {
        // MATCH SUCCESS!
        setTimeout(() => {
          playMatchSfx();
          first.el.classList.add('card-matched', 'animate-match');
          second.el.classList.add('card-matched', 'animate-match');

          // Spoken Mandarin Praise & Word
          speakChineseWord(first.card.word, first.card.pinyin, first.card.meaning);

          // Update praise banner
          const praiseBanner = document.getElementById('praiseBanner');
          praiseBanner.innerHTML = `
            <span class="text-emerald-600 flex items-center gap-1.5">
              <span>🎉</span>
              <span>ถูกต้อง! <b>${first.card.word}</b> (${first.card.pinyin}) = ${first.card.meaning}</span>
            </span>
          `;

          matchedCount++;
          document.getElementById('matchesFound').textContent = matchedCount;
          flippedCards = [];
          isProcessing = false;

          const numPairs = (difficulty === 'easy' ? 4 : difficulty === 'medium' ? 6 : 8);
          if (matchedCount === numPairs) {
            setTimeout(handleGameWon, 600);
          }
        }, 350);

      } else {
        // MISMATCH
        setTimeout(() => {
          playMismatchSfx();
          first.el.classList.remove('card-flipped');
          second.el.classList.remove('card-flipped');
          flippedCards = [];
          isProcessing = false;
        }, 850);
      }
    }

    // 7. VICTORY & REWARDS
    function handleGameWon() {
      // Confetti fireworks
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }

      // Voice praise
      if ('speechSynthesis' in window) {
        const ut = new SpeechSynthesisUtterance('太棒了！全部答对了！');
        ut.lang = 'zh-CN';
        ut.rate = 0.9;
        window.speechSynthesis.speak(ut);
      }

      // Awards
      const starsEarned = (difficulty === 'easy' ? 3 : difficulty === 'medium' ? 4 : 5);
      const coinsEarned = starsEarned * 5;

      userStars += starsEarned;
      localStorage.setItem('KB_STARS', userStars);
      document.getElementById('starsChip').textContent = userStars;

      // Update Kidobits Wallet if loaded
      if (window.KidobitsWallet) {
        try {
          KidobitsWallet.addReward({ stars: starsEarned, coins: coinsEarned });
        } catch (e) {}
      }

      document.getElementById('winStarsAward').textContent = starsEarned;
      document.getElementById('winCoinsAward').textContent = coinsEarned;
      document.getElementById('winModal').classList.remove('hidden');
    }

    function closeWinModal() {
      document.getElementById('winModal').classList.add('hidden');
    }

    // 8. INITIALIZE ON LOAD
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('starsChip').textContent = userStars;
      renderCategoryTabs();
      restartGame();
    });
  </script>
</body>
</html>
