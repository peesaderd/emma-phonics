      if (micAudioStream.current && micAudioStream.current.active) return micAudioStream.current;

/* ===== pickMimeType ===== */
function pickMimeType() {
      if (typeof MediaRecorder === 'undefined') return '';
      const cands = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];

/* ===== checkPhonicsMatch ===== */
function checkPhonicsMatch(cleanTranscript, cur) {
      if (!cleanTranscript) return null;
      const targetWord = (cur.word || '').toLowerCase().trim();
      // 1. Instant match if the target word is anywhere in the clean transcript!
      if (targetWord && cleanTranscript.includes(targetWord)) return targetWord;

      const acceptedList = phonicsKeywords[cur.letter] || [targetWord];
      const tokens = cleanTranscript.split(/\s+/).filter(Boolean);

      for (const kw of acceptedList) {
        const lowKw = kw.toLowerCase().trim();
        if (!lowKw) continue;
        if (lowKw.includes(' ')) {
          if (cleanTranscript.includes(lowKw)) return kw;          // multi-word phrase
        } else if (lowKw.length <= 2) {
          if (tokens.includes(lowKw)) return kw;                    // short token must be exact
        } else {
          if (tokens.includes(lowKw) || cleanTranscript.includes(lowKw)) return kw;
        }
      }

      // 2. AI-phonetic fallback: the child clearly SAID the target word, even if
      //    Whisper spelled it wildly ("Caesar's coup" for "cat"). We accept it as
      //    long as the sound matches — the child is not penalised for Whisper.
      if (targetWord && soundsLike(cleanTranscript, targetWord)) {
        return targetWord + ' (sound)';
      }
      return null;
    }

/* ===== fuzzyMatchKeywords ===== */
function fuzzyMatchKeywords(cleanTranscript, cur) {
      if (!cleanTranscript) return null;
      const target = (cur.word || '').toLowerCase().trim();
      const list = (typeof phonicsKeywords !== 'undefined' && phonicsKeywords[cur.letter]) || [target];
      const tokens = cleanTranscript.split(/\s+/).filter(Boolean);
      for (const kw of list) {
        const lowKw = (kw || '').toLowerCase().trim();
        if (!lowKw) continue;
        if (lowKw.includes(' ')) {                       // multi-word phrase
          if (cleanTranscript.includes(lowKw)) return kw;
          continue;
        }
        if (tokens.indexOf(lowKw) !== -1) return kw;     // exact whole-token hit
        if (lowKw.length >= 4 && cleanTranscript.includes(lowKw)) return kw;
      }
      return null;
    }

      // each attempt. This timer only nudges the child if nothing was heard.
      if (listenTimer) clearTimeout(listenTimer);

        if (!hasAnswered && isListeningActive) {
          window.__emmaDbg && __emmaDbg('info', 'ยังไม่ได้ยินเสียง — แตะปุ่มไมค์เพื่อพูดอีกครั้ง');

/* ===== stopSpeechEngine ===== */
function stopSpeechEngine() {
      isListeningActive = false;
      isScoring = false;
      micArmed = false;
      if (typeof setMicState === 'function') setMicState('off'); // Reset micArmed so next turn starts mic cleanly
      if (typeof updateVuVisual === 'function') updateVuVisual(0);
      if (listenTimer) { clearTimeout(listenTimer); listenTimer = null; }
      if (recognition) {
        try {
          recognition.onend = null;
          recognition.abort();
        } catch(e) {}
        recognition = null;
      }
      try {
        if (typeof mediaRec !== 'undefined' && mediaRec && mediaRec.state !== 'inactive') {
          mediaRec.onstop = null;
          mediaRec.stop();
        }
        if (typeof chunkTimer !== 'undefined' && chunkTimer) { clearTimeout(chunkTimer); chunkTimer = null; }
        if (typeof speechPollId !== 'undefined' && speechPollId) { cancelAnimationFrame(speechPollId); speechPollId = null; }
        sttAttemptId++; // invalidate any in-flight upload
      } catch(e) {}
      window.__emmaStat && __emmaStat('emmaDbgMic', 'พักไมค์ (รอครูพูดจบ)');
    }

/* ===== playMp3File ===== */
function playMp3File(url, onEndedCallback) {
      if (currentAudioElem) {
        try {
          currentAudioElem.pause();
          currentAudioElem.currentTime = 0;
          currentAudioElem.src = '';
        } catch(e) {}
        currentAudioElem = null;
      }
      const audio = new Audio(url);
      currentAudioElem = audio;
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        try {
          audio.pause();
          audio.src = '';
        } catch(e) {}
        if (currentAudioElem === audio) {
          currentAudioElem = null;
        }
        if (onEndedCallback) onEndedCallback();
      };
      audio.onended = finish;
      audio.onerror = finish;
      audio.play().catch(finish);
    }

      currentIndex = (currentIndex + 1) % phonicsData.length;

function handleFailedOrTimeoutCondition(cur) {

      if (attemptNumber === 1) {

        playMp3File('/kidobits/audio/repeat_1.mp3?v=5', () => {

      } else if (attemptNumber === 2) {

        tutorStateBadge.className = "absolute top-2 right-2 px-2.5 py-0.5 rounded-full bg-orange-500 text-white text-[10px] font-black shadow-sm";

        window.__emmaDbg && __emmaDbg('fail','รอบ 2 ไม่ผ่าน → เข้ารอบ 3');
        playMp3File('/kidobits/audio/try_again.mp3?v=5', () => {
          setTimeout(() => startSmartChildListening(cur), 300);
        });

      } else {
        // ATTEMPT 3 FAILED / SILENCE:
        // STRICT RULE: NEVER AUTO-ADVANCE! NEVER PRAISE! STAY ON CURRENT LETTER!
        window.__emmaRecordResult && window.__emmaRecordResult(cur.letter, false, 3, '-', '-');
        window.__emmaDbg && __emmaDbg('fail', `ครบ 3 ครั้งแล้วยังไม่ได้ยินเสียง/ไม่ผ่านตัว ${cur.letter} → หยุดรอให้เด็กแตะลองใหม่ หรือแตะข้าม (ไม่ข้ามอัตโนมัติเด็ดขาด)`);
        
        stopSpeechEngine();
        isWaitingForRetry = true;
        
        tutorStateBadge.textContent = "ยังไม่ได้ยินเสียงหนูเลย 🎙️";
        tutorStateBadge.className = "absolute top-2 right-2 px-2.5 py-0.5 rounded-full bg-rose-500 text-white text-[10px] font-black shadow-sm";
        
        liveBtnLabel.textContent = `แตะที่นี่เพื่อลองใหม่ 🔄 หรือกดข้าม`;
        liveMicActionBtn.className = "w-full flex items-center justify-center gap-2.5 py-3 px-4 rounded-2xl bg-amber-100 text-amber-900 border-2 border-amber-400 shadow-[0_4px_0_0_#d97706] active:translate-y-1 active:shadow-none transition-all cursor-pointer animate-pulse";
        
        const micSym = __kbEl('micIconHidden');
        if (micSym) micSym.textContent = 'replay';

        tutorLiveSpeechText.textContent = `ครูเอ็มม่า: "ยังไม่ได้ยินเสียงหนูเลยค่ะ แตะปุ่มเพื่อลองพูดใหม่ หรือกดข้ามไปตัวถัดไปนะคะ"`;

      isTeacherSpeaking = true;

  var chips = el('div','flex gap-1 flex-wrap justify-center mt-3');
  phonicsData.forEach(function(v, y){
    var cls = 'w-9 h-9 rounded-xl font-extrabold text-sm ' + (y === currentIndex ? 'bg-black text-white' : 'bg-[#FFF0F5]');
    var b = txt('button', cls, v.letter);
    b.setAttribute('data-azchip','1');
    b.onclick = function(){ currentIndex = y; render(); startTeacherTurn(); };
    chips.appendChild(b);
  });
  card.appendChild(chips);

  box.appendChild(card);
  wrap.appendChild(box);
  root.appendChild(wrap);
  root.appendChild(buildBottomNav());
  clearVerdict();
}

/* ---------- สถานะปุ่มไมค์ (ของเดิมมีแค่ mic-recording) ---------- */
function setMicState(mode){
  var btn = document.getElementById('liveMicActionBtn');
  var lbl = document.getElementById('micStateLabel');
  if (!btn) return;
  btn.classList.remove('mic-recording','mic-idle');
  if (mode === 'rec') {
    btn.classList.add('mic-recording');
    btn.style.background = '#FF5B6A';
    if (lbl) { lbl.textContent = T.micRec; lbl.className = 'text-[11px] font-extrabold mt-1 text-[#FF5B6A]'; }
  } else if (mode === 'off') {
    btn.style.background = '#CBD5E1';
    if (lbl) { lbl.textContent = T.micOff; lbl.className = 'text-[11px] font-extrabold mt-1 text-slate-400'; }
  } else {
    btn.classList.add('mic-idle');
    btn.style.background = '#5B6EE1';
    if (lbl) { lbl.textContent = T.micIdle; lbl.className = 'text-[11px] font-extrabold mt-1 text-[#5B6EE1]'; }
  }
}

/* ---------- ข้อความผลลัพธ์ ถูก/ผิด ---------- */
function showVerdict(pass){
  var e = document.getElementById('verdictText');
  if (!e) return;
  e.textContent = pass ? T.passOk : T.retry;
  e.style.display = 'block';
  e.style.color = pass ? '#1B9A62' : '#E11D48';
}

function clearVerdict(){
  var e = document.getElementById('verdictText');
  if (!e) return;
  e.textContent = '';
  e.style.display = 'none';
}

/* ---------- ลูปการสอน: ครูพูด → ไมค์เปิดเอง → ผ่าน → ชม → ไปต่อ ---------- */
function boot(){
  render();
  setMicState('off');
  setTimeout(function(){
    startTeacherTurn();
    setMicState('off');
  }, 400);
}

boot();
</script>
