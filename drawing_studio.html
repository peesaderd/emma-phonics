<!DOCTYPE html>
<html lang="th" class="min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFFDF9">
  <title>Kidobits Drawing Studio · ระบายสี & วาดรูปแสนสนุก 🎨✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600;700;800;900&family=Prompt:wght@500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Plus Jakarta Sans', 'Prompt', 'Noto Sans Thai', 'sans-serif'],
            thai: ['Noto Sans Thai', 'Prompt', 'sans-serif'],
            bubble: ['Baloo 2', 'Noto Sans Thai', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100%;
      font-family: 'Noto Sans Thai', 'Plus Jakarta Sans', sans-serif;
      overscroll-behavior-y: auto;
      background-color: #F8F9FE;
    }
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    nav.fixed[class*="bottom-"] {
      bottom: max(12px, calc(10px + env(safe-area-inset-bottom, 0px))) !important;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Canvas Wrapper & Grid Touch */
    .canvas-container {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #drawingCanvas {
      cursor: crosshair;
      touch-action: none;
    }

    /* Pulse Glow */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(236, 72, 153, 0); }
    }
    .active-tool {
      border-color: #EC4899 !important;
      background-color: #FDF2F8 !important;
      color: #DB2777 !important;
      transform: scale(1.05);
    }
    .color-swatch-active {
      transform: scale(1.22);
      box-shadow: 0 0 0 3px white, 0 0 0 5px #EC4899 !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 select-none pb-28 overscroll-y-auto">

  <!-- 1. STANDARD KIDOBITS TOP BAR -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-pink-100 shadow-xs">
    <div class="max-w-4xl mx-auto px-3 py-2 flex items-center justify-between gap-2">
      <!-- Back button -->
      <button onclick="if (history.length > 1) { history.back(); } else { location.href='/theme/theme_home.html'; }" class="btn-press flex items-center gap-1 px-3 py-1.5 rounded-full bg-white shadow-xs border border-slate-200 text-xs font-bold text-slate-700 hover:bg-slate-50 transition active:scale-95" title="ย้อนกลับ">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        <span>กลับ</span>
      </button>

      <!-- Center Title -->
      <div class="flex items-center gap-1.5">
        <span class="text-xl">🎨</span>
        <div>
          <span class="text-xs sm:text-sm font-black text-slate-900 tracking-tight">Kidobits Art Studio</span>
          <span class="hidden sm:inline-block px-2 py-0.2 rounded-full bg-pink-100 text-pink-700 text-[10px] font-bold ml-1">ระบายสี & วาดรูป</span>
        </div>
      </div>

      <!-- Stats Chips -->
      <div class="flex items-center gap-1.5">
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-red-50 border border-red-100 text-[11px] font-black text-red-600 shadow-2xs">
          <span>🔥</span>
          <span id="streakChip">7</span>
        </div>
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-50 border border-amber-100 text-[11px] font-black text-amber-600 shadow-2xs">
          <span>⭐</span>
          <span id="starsChip">0</span>
        </div>
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-100 text-[11px] font-black text-emerald-600 shadow-2xs">
          <span>🪙</span>
          <span id="userCoins">240</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 2. MAIN ART STUDIO WORKSPACE -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-3 sm:px-4 py-2 sm:py-3 flex flex-col justify-start">

    <!-- Coloring Template Selector Carousel -->
    <div class="w-full mb-2">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1" id="templateTabs">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- 3. DRAWING CANVAS BOX -->
    <div class="relative w-full rounded-3xl overflow-hidden shadow-xl border-4 border-white bg-white mb-2.5 canvas-container aspect-square sm:aspect-4/3 flex items-center justify-center">
      <canvas id="drawingCanvas" class="w-full h-full block bg-white"></canvas>

      <!-- Top Overlay Quick Controls (Undo, Redo, Clear) -->
      <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5 bg-white/90 backdrop-blur-md px-2 py-1.5 rounded-2xl border border-slate-200/80 shadow-md">
        <button onclick="undoStroke()" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 flex items-center justify-center text-xs transition active:scale-90" title="ย้อนกลับ (Undo)">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button onclick="redoStroke()" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 flex items-center justify-center text-xs transition active:scale-90" title="ทำซ้ำ (Redo)">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button onclick="clearCanvasPrompt()" class="w-8 h-8 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 flex items-center justify-center text-xs transition active:scale-90" title="ล้างกระดาน (Clear)">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>

      <!-- Watermark Badge -->
      <div class="absolute bottom-2.5 left-3 pointer-events-none opacity-40 flex items-center gap-1 text-[10px] font-black text-slate-400">
        <span>🎨 Kidobits Art</span>
      </div>
    </div>

    <!-- 4. TOOLBAR ROW 1: DRAWING TOOLS -->
    <div class="w-full bg-white rounded-2xl border border-slate-200/90 p-2 sm:p-2.5 mb-2 shadow-xs flex items-center justify-between gap-1 sm:gap-2 overflow-x-auto no-scrollbar">
      
      <!-- Brush Tool -->
      <button onclick="setTool('brush')" id="toolBtn_brush" class="tool-btn active-tool flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold transition active:scale-95">
        <i class="fa-solid fa-paint-brush text-sm"></i>
        <span class="hidden sm:inline">พู่กัน</span>
      </button>

      <!-- Crayon Tool -->
      <button onclick="setTool('crayon')" id="toolBtn_crayon" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold transition active:scale-95 text-slate-700">
        <i class="fa-solid fa-pen-nib text-sm"></i>
        <span class="hidden sm:inline">สีเทียน</span>
      </button>

      <!-- Rainbow Glitter Tool -->
      <button onclick="setTool('rainbow')" id="toolBtn_rainbow" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold transition active:scale-95 text-slate-700 bg-gradient-to-r from-pink-50 to-amber-50">
        <span>✨</span>
        <span class="hidden sm:inline">สายรุ้ง</span>
      </button>

      <!-- Flood Fill Bucket -->
      <button onclick="setTool('bucket')" id="toolBtn_bucket" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold transition active:scale-95 text-slate-700">
        <i class="fa-solid fa-fill-drip text-sm"></i>
        <span class="hidden sm:inline">เทสี</span>
      </button>

      <!-- Eraser Tool -->
      <button onclick="setTool('eraser')" id="toolBtn_eraser" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold transition active:scale-95 text-slate-700">
        <i class="fa-solid fa-eraser text-sm"></i>
        <span class="hidden sm:inline">ยางลบ</span>
      </button>

      <!-- Sticker Stamp Tool -->
      <button onclick="setTool('sticker')" id="toolBtn_sticker" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold transition active:scale-95 text-slate-700">
        <span>⭐</span>
        <span class="hidden sm:inline">สติกเกอร์</span>
      </button>

      <div class="h-6 w-px bg-slate-200 mx-0.5"></div>

      <!-- Brush Size Selector -->
      <div class="flex items-center gap-1">
        <button onclick="setBrushSize(4)" id="sizeBtn_4" class="size-btn w-7 h-7 rounded-lg border border-slate-200 flex items-center justify-center transition active:scale-90" title="หัวเล็ก">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-800"></span>
        </button>
        <button onclick="setBrushSize(10)" id="sizeBtn_10" class="size-btn active-tool w-7 h-7 rounded-lg border border-pink-400 bg-pink-50 flex items-center justify-center transition active:scale-90" title="หัวกลาง">
          <span class="w-3 h-3 rounded-full bg-pink-600"></span>
        </button>
        <button onclick="setBrushSize(22)" id="sizeBtn_22" class="size-btn w-7 h-7 rounded-lg border border-slate-200 flex items-center justify-center transition active:scale-90" title="หัวใหญ่">
          <span class="w-4.5 h-4.5 rounded-full bg-slate-800"></span>
        </button>
      </div>

    </div>

    <!-- 5. STICKERS CAROUSEL (Appears when Sticker tool is active) -->
    <div id="stickerPaletteBox" class="hidden w-full bg-amber-50/80 rounded-2xl border border-amber-200 p-2 mb-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
      <span class="text-xs font-black text-amber-800 shrink-0">แตะเลือกสติกเกอร์:</span>
      <div class="flex items-center gap-1.5" id="stickersList">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- 6. VIBRANT COLOR PALETTE SWATCHES -->
    <div class="w-full bg-white rounded-2xl border border-slate-200/90 p-2 sm:p-2.5 mb-3 shadow-xs">
      <div class="flex items-center justify-between gap-1.5 overflow-x-auto no-scrollbar py-0.5" id="paletteSwatches">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- 7. ACTION BUTTONS: SAVE & WIN REWARDS -->
    <div class="flex items-center gap-2">
      <button onclick="downloadArtwork()" class="py-3 px-4 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 font-black text-xs transition active:scale-95 flex items-center justify-center gap-1.5 shadow-xs">
        <i class="fa-solid fa-download text-xs text-pink-500"></i>
        <span>บันทึกภาพ</span>
      </button>
      <button onclick="finishDrawingReward()" class="flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-pink-500 via-rose-500 to-orange-500 hover:from-pink-600 hover:to-orange-600 text-white font-black text-sm shadow-md shadow-pink-500/25 transition active:scale-95 flex items-center justify-center gap-2">
        <span>🏆 ส่งผลงานรับดาว (+5 ⭐)</span>
      </button>
    </div>

  </main>

  <!-- 8. REWARD MODAL -->
  <div id="artWinModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl border-4 border-pink-300 animate-pop">
      <div class="text-5xl animate-bounce">🎨</div>
      <div>
        <h3 class="text-xl font-black text-slate-900 font-display">สุดยอดศิลปินตัวน้อย!</h3>
        <p class="text-xs text-slate-500 font-bold mt-1">วาดรูปและระบายสีได้สวยงามมาก รับดาวสะสมเพิ่มเลย!</p>
      </div>

      <div class="flex items-center justify-center gap-4 py-3 bg-pink-50 rounded-2xl border border-pink-200">
        <div class="flex items-center gap-1.5 text-base font-black text-pink-700">
          <span>⭐</span>
          <span>+5 ดาว</span>
        </div>
        <div class="flex items-center gap-1.5 text-base font-black text-emerald-700">
          <span>🪙</span>
          <span>+25 เหรียญ</span>
        </div>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <button onclick="closeArtModal()" class="flex-1 py-2.5 px-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs transition active:scale-95">
          ✏️ วาดต่อ
        </button>
        <button onclick="downloadArtwork(); closeArtModal();" class="flex-1 py-2.5 px-3 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black text-xs shadow-md shadow-pink-500/20 transition active:scale-95">
          💾 เซฟรูปเก็บไว้
        </button>
      </div>
    </div>
  </div>

    <!-- 1. Home -->
    <button onclick="window.location.href='/theme/theme_home.html'" class="flex flex-col items-center gap-0.5 min-w-[52px]" aria-label="Home">

      <span class="text-[10px] font-extrabold text-[#9A8FA8]">Home</span>

    <button onclick="window.location.href='/theme/theme_phonics_map.html'" class="flex flex-col items-center gap-0.5 min-w-[52px]" aria-label="Phonics">

  <script src="/js/kidobits_wallet.js"></script>

  <!-- CANVAS DRAWING ENGINE SCRIPT -->
  <script>
    // 1. TEMPLATES REPOSITORY
    const TEMPLATES = [
      { id: 'free', name: 'วาดรูปอิสระ', icon: '🎨', drawFn: null },
      { id: 'rocket', name: 'จรวดอวกาศ', icon: '🚀', drawFn: drawRocketOutline },
      { id: 'lion', name: 'สิงโตเจ้าป่า', icon: '🦁', drawFn: drawLionOutline },
      { id: 'fox', name: 'สุนัขจิ้งจอก', icon: '🦊', drawFn: drawFoxOutline },
      { id: 'cat', name: 'ลูกแมวน้อย', icon: '🐱', drawFn: drawCatOutline },
      { id: 'star', name: 'ดาวและสายรุ้ง', icon: '🌈', drawFn: drawRainbowOutline }
    ];

    // 2. PALETTE COLORS
    const PALETTE_COLORS = [
      '#EF4444', // Red
      '#F97316', // Orange
      '#F59E0B', // Amber
      '#FACC15', // Yellow
      '#84CC16', // Lime
      '#10B981', // Emerald
      '#06B6D4', // Cyan
      '#3B82F6', // Blue
      '#8B5CF6', // Purple
      '#EC4899', // Pink
      '#78350F', // Brown
      '#1E293B', // Charcoal/Black
    ];

    // 3. STICKERS
    const STICKERS = ['🦁', '🚀', '🦊', '🐱', '👑', '🌸', '💖', '⭐', '🎈', '☀️', '🍦', '🍩'];

    // 4. APP STATE
    let canvas, ctx;
    let currentTool = 'brush'; // 'brush', 'crayon', 'rainbow', 'bucket', 'eraser', 'sticker'
    let currentColor = '#EC4899';
    let currentBrushSize = 10;
    let selectedSticker = '⭐';
    let currentTemplateId = 'free';

    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let rainbowHue = 0;

    // Undo/Redo Stacks
    const MAX_HISTORY = 20;
    let undoStack = [];
    let redoStack = [];

    let userStars = parseInt(localStorage.getItem('KB_STARS') || '0', 10);

    // Audio SFX synthesizer
    let audioCtx = null;
    function playTone(freq, duration = 0.08, type = 'sine') {
      try {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx) {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        }
      } catch (e) {}
    }

    // 5. CANVAS SETUP & RESIZING
    function initCanvas() {
      canvas = document.getElementById('drawingCanvas');
      ctx = canvas.getContext('2d', { willReadFrequently: true });

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      // Fill White background initially
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, rect.width, rect.height);

      saveState();

      // Touch & Mouse Event Listeners
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
      canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
      canvas.addEventListener('touchend', stopDrawing, { passive: false });
      canvas.addEventListener('touchcancel', stopDrawing, { passive: false });
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function handleTouchStart(e) {
      e.preventDefault();
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        startDrawing({
          clientX: touch.clientX,
          clientY: touch.clientY
        });
      }
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        draw({
          clientX: touch.clientX,
          clientY: touch.clientY
        });
      }
    }

    // 6. DRAWING CORE
    function startDrawing(e) {
      const { x, y } = getCoords(e);
      lastX = x;
      lastY = y;

      if (currentTool === 'sticker') {
        placeSticker(x, y);
        saveState();
        playTone(520, 0.12, 'triangle');
        return;
      }

      if (currentTool === 'bucket') {
        floodFill(Math.round(x), Math.round(y), currentColor);
        saveState();
        playTone(440, 0.1, 'sine');
        return;
      }

      isDrawing = true;
      playTone(320, 0.05, 'sine');

      // Draw initial dot
      drawDot(x, y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const { x, y } = getCoords(e);

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);

      if (currentTool === 'eraser') {
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = currentBrushSize * 1.8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      } else if (currentTool === 'rainbow') {
        rainbowHue = (rainbowHue + 4) % 360;
        ctx.strokeStyle = `hsl(${rainbowHue}, 90%, 55%)`;
        ctx.lineWidth = currentBrushSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      } else if (currentTool === 'crayon') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentBrushSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = 0.65;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      } else {
        // Normal brush
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentBrushSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }

      lastX = x;
      lastY = y;
    }

    function drawDot(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, (currentTool === 'eraser' ? currentBrushSize * 0.9 : currentBrushSize / 2), 0, Math.PI * 2);
      if (currentTool === 'eraser') {
        ctx.fillStyle = '#FFFFFF';
      } else if (currentTool === 'rainbow') {
        ctx.fillStyle = `hsl(${rainbowHue}, 90%, 55%)`;
      } else {
        ctx.fillStyle = currentColor;
      }
      ctx.fill();
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        saveState();
      }
    }

    function placeSticker(x, y) {
      const size = Math.max(32, currentBrushSize * 2.8);
      ctx.save();
      ctx.font = `${size}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(selectedSticker, x, y);
      ctx.restore();
    }

    // 7. FLOOD FILL ALGORITHM (Simple scanline)
    function floodFill(startX, startY, fillHex) {
      const dpr = window.devicePixelRatio || 1;
      const actualX = Math.round(startX * dpr);
      const actualY = Math.round(startY * dpr);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      const targetIdx = (actualY * canvas.width + actualX) * 4;
      const tr = data[targetIdx];
      const tg = data[targetIdx + 1];
      const tb = data[targetIdx + 2];
      const ta = data[targetIdx + 3];

      // Parse fill hex
      const fillColor = hexToRgba(fillHex);
      if (colorMatch(tr, tg, tb, ta, fillColor.r, fillColor.g, fillColor.b, 255)) {
        return; // Already matches
      }

      const pixelStack = [[actualX, actualY]];
      const width = canvas.width;
      const height = canvas.height;

      while (pixelStack.length > 0) {
        const [x, y] = pixelStack.pop();
        let currentY = y;
        let idx = (currentY * width + x) * 4;

        while (currentY >= 0 && colorMatch(data[idx], data[idx+1], data[idx+2], data[idx+3], tr, tg, tb, ta)) {
          currentY--;
          idx -= width * 4;
        }

        currentY++;
        idx += width * 4;
        let reachLeft = false;
        let reachRight = false;

        while (currentY < height && colorMatch(data[idx], data[idx+1], data[idx+2], data[idx+3], tr, tg, tb, ta)) {
          data[idx] = fillColor.r;
          data[idx + 1] = fillColor.g;
          data[idx + 2] = fillColor.b;
          data[idx + 3] = 255;

          if (x > 0) {
            if (colorMatch(data[idx - 4], data[idx - 3], data[idx - 2], data[idx - 1], tr, tg, tb, ta)) {
              if (!reachLeft) {
                pixelStack.push([x - 1, currentY]);
                reachLeft = true;
              }
            } else if (reachLeft) {
              reachLeft = false;
            }
          }

          if (x < width - 1) {
            if (colorMatch(data[idx + 4], data[idx + 5], data[idx + 6], data[idx + 7], tr, tg, tb, ta)) {
              if (!reachRight) {
                pixelStack.push([x + 1, currentY]);
                reachRight = true;
              }
            } else if (reachRight) {
              reachRight = false;
            }
          }

          currentY++;
          idx += width * 4;
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function colorMatch(r1, g1, b1, a1, r2, g2, b2, a2) {
      return Math.abs(r1 - r2) < 32 && Math.abs(g1 - g2) < 32 && Math.abs(b1 - b2) < 32;
    }

    function hexToRgba(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    // 8. UNDO / REDO / CLEAR
    function saveState() {
      redoStack = []; // Clear redo on new action
      if (undoStack.length >= MAX_HISTORY) {
        undoStack.shift();
      }
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function undoStroke() {
      if (undoStack.length > 1) {
        const current = undoStack.pop();
        redoStack.push(current);
        const prev = undoStack[undoStack.length - 1];
        ctx.putImageData(prev, 0, 0);
        playTone(280, 0.08, 'sine');
      }
    }

    function redoStroke() {
      if (redoStack.length > 0) {
        const next = redoStack.pop();
        undoStack.push(next);
        ctx.putImageData(next, 0, 0);
        playTone(380, 0.08, 'sine');
      }
    }

    function clearCanvasPrompt() {
      const rect = canvas.getBoundingClientRect();
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, rect.width, rect.height);
      
      const tmpl = TEMPLATES.find(t => t.id === currentTemplateId);
      if (tmpl && tmpl.drawFn) {
        tmpl.drawFn(rect.width, rect.height);
      }
      saveState();
      playTone(220, 0.12, 'sawtooth');
    }

    // 9. OUTLINE TEMPLATES DRAWING FUNCTIONS
    function drawRocketOutline(w, h) {
      ctx.save();
      ctx.strokeStyle = '#2D3748';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = w / 2;
      const cy = h / 2 - 10;

      // Rocket body (Capsule/Cone)
      ctx.beginPath();
      ctx.moveTo(cx, cy - 90);
      ctx.bezierCurveTo(cx + 45, cy - 40, cx + 45, cy + 50, cx + 35, cy + 80);
      ctx.lineTo(cx - 35, cy + 80);
      ctx.bezierCurveTo(cx - 45, cy + 50, cx - 45, cy - 40, cx, cy - 90);
      ctx.stroke();

      // Rocket tip nose cone line
      ctx.beginPath();
      ctx.moveTo(cx - 28, cy - 35);
      ctx.quadraticCurveTo(cx, cy - 20, cx + 28, cy - 35);
      ctx.stroke();

      // Porthole Window
      ctx.beginPath();
      ctx.arc(cx, cy + 10, 24, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy + 10, 16, 0, Math.PI * 2);
      ctx.stroke();

      // Left Wing
      ctx.beginPath();
      ctx.moveTo(cx - 38, cy + 30);
      ctx.lineTo(cx - 75, cy + 85);
      ctx.lineTo(cx - 35, cy + 80);
      ctx.stroke();

      // Right Wing
      ctx.beginPath();
      ctx.moveTo(cx + 38, cy + 30);
      ctx.lineTo(cx + 75, cy + 85);
      ctx.lineTo(cx + 35, cy + 80);
      ctx.stroke();

      // Flames
      ctx.beginPath();
      ctx.moveTo(cx - 25, cy + 85);
      ctx.lineTo(cx - 15, cy + 115);
      ctx.lineTo(cx, cy + 95);
      ctx.lineTo(cx + 15, cy + 115);
      ctx.lineTo(cx + 25, cy + 85);
      ctx.stroke();

      // Background Stars & Moon
      drawStarShape(cx - 95, cy - 70, 16);
      drawStarShape(cx + 95, cy - 60, 14);
      drawStarShape(cx - 80, cy + 40, 12);
      drawStarShape(cx + 85, cy + 50, 15);

      ctx.restore();
    }

    function drawLionOutline(w, h) {
      ctx.save();
      ctx.strokeStyle = '#2D3748';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = w / 2;
      const cy = h / 2 - 10;

      // Mane (Cloud of circles around head)
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const mx = cx + Math.cos(angle) * 75;
        const my = cy + Math.sin(angle) * 75;
        ctx.beginPath();
        ctx.arc(mx, my, 26, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Head circle
      ctx.beginPath();
      ctx.arc(cx, cy, 62, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.stroke();

      // Ears
      ctx.beginPath();
      ctx.arc(cx - 42, cy - 42, 14, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + 42, cy - 42, 14, 0, Math.PI * 2);
      ctx.stroke();

      // Eyes
      ctx.beginPath();
      ctx.arc(cx - 20, cy - 10, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#2D3748';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx + 20, cy - 10, 6, 0, Math.PI * 2);
      ctx.fill();

      // Cute Nose
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy + 8);
      ctx.lineTo(cx + 10, cy + 8);
      ctx.lineTo(cx, cy + 18);
      ctx.closePath();
      ctx.fill();

      // Smile
      ctx.beginPath();
      ctx.moveTo(cx, cy + 18);
      ctx.lineTo(cx, cy + 26);
      ctx.moveTo(cx - 14, cy + 30);
      ctx.quadraticCurveTo(cx - 7, cy + 35, cx, cy + 26);
      ctx.quadraticCurveTo(cx + 7, cy + 35, cx + 14, cy + 30);
      ctx.stroke();

      // Whiskers
      ctx.beginPath();
      ctx.moveTo(cx - 30, cy + 15); ctx.lineTo(cx - 50, cy + 10);
      ctx.moveTo(cx - 30, cy + 22); ctx.lineTo(cx - 52, cy + 24);
      ctx.moveTo(cx + 30, cy + 15); ctx.lineTo(cx + 50, cy + 10);
      ctx.moveTo(cx + 30, cy + 22); ctx.lineTo(cx + 52, cy + 24);
      ctx.stroke();

      ctx.restore();
    }

    function drawFoxOutline(w, h) {
      ctx.save();
      ctx.strokeStyle = '#2D3748';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = w / 2;
      const cy = h / 2 - 10;

      // Ears (Triangles)
      ctx.beginPath();
      ctx.moveTo(cx - 55, cy - 30);
      ctx.lineTo(cx - 45, cy - 90);
      ctx.lineTo(cx - 15, cy - 45);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 55, cy - 30);
      ctx.lineTo(cx + 45, cy - 90);
      ctx.lineTo(cx + 15, cy - 45);
      ctx.stroke();

      // Face
      ctx.beginPath();
      ctx.moveTo(cx - 65, cy - 20);
      ctx.quadraticCurveTo(cx - 40, cy + 35, cx, cy + 70);
      ctx.quadraticCurveTo(cx + 40, cy + 35, cx + 65, cy - 20);
      ctx.quadraticCurveTo(cx, cy - 50, cx - 65, cy - 20);
      ctx.stroke();

      // Cheeks divider
      ctx.beginPath();
      ctx.moveTo(cx - 60, cy - 10);
      ctx.quadraticCurveTo(cx - 20, cy + 15, cx, cy + 50);
      ctx.quadraticCurveTo(cx + 20, cy + 15, cx + 60, cy - 10);
      ctx.stroke();

      // Eyes
      ctx.beginPath();
      ctx.arc(cx - 25, cy - 2, 6, 0, Math.PI * 2);
      ctx.arc(cx + 25, cy - 2, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#2D3748';
      ctx.fill();

      // Nose
      ctx.beginPath();
      ctx.arc(cx, cy + 58, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawCatOutline(w, h) {
      ctx.save();
      ctx.strokeStyle = '#2D3748';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = w / 2;
      const cy = h / 2;

      // Head
      ctx.beginPath();
      ctx.arc(cx, cy, 65, 0, Math.PI * 2);
      ctx.stroke();

      // Ears
      ctx.beginPath();
      ctx.moveTo(cx - 55, cy - 35);
      ctx.lineTo(cx - 50, cy - 85);
      ctx.lineTo(cx - 15, cy - 60);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 55, cy - 35);
      ctx.lineTo(cx + 50, cy - 85);
      ctx.lineTo(cx + 15, cy - 60);
      ctx.stroke();

      // Eyes
      ctx.beginPath();
      ctx.arc(cx - 24, cy - 10, 7, 0, Math.PI * 2);
      ctx.arc(cx + 24, cy - 10, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#2D3748';
      ctx.fill();

      // Nose
      ctx.beginPath();
      ctx.arc(cx, cy + 10, 5, 0, Math.PI * 2);
      ctx.fill();

      // Smile
      ctx.beginPath();
      ctx.arc(cx - 10, cy + 18, 10, 0, Math.PI);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + 10, cy + 18, 10, 0, Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawRainbowOutline(w, h) {
      ctx.save();
      ctx.strokeStyle = '#2D3748';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = w / 2;
      const cy = h / 2 + 30;

      // Rainbow Arcs
      for (let r = 50; r <= 110; r += 20) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI, Math.PI * 2);
        ctx.stroke();
      }

      // Clouds on left
      drawCloudShape(cx - 85, cy);
      // Clouds on right
      drawCloudShape(cx + 85, cy);

      ctx.restore();
    }

    function drawCloudShape(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.arc(x - 18, y + 8, 16, 0, Math.PI * 2);
      ctx.arc(x + 18, y + 8, 16, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawStarShape(cx, cy, spikes) {
      const outerRadius = spikes;
      const innerRadius = spikes / 2;
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / 5;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < 5; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.stroke();
    }

    // 10. UI CONTROLS & PALETTE
    function renderTemplateTabs() {
      const container = document.getElementById('templateTabs');
      container.innerHTML = TEMPLATES.map(t => {
        const isActive = (t.id === currentTemplateId);
        return `
          <button onclick="selectTemplate('${t.id}')" class="shrink-0 px-3 py-1.5 rounded-2xl text-xs font-black transition active:scale-95 flex items-center gap-1.5 border ${isActive ? 'bg-pink-500 text-white border-pink-600 shadow-sm' : 'bg-white hover:bg-pink-50 text-slate-700 border-slate-200'}">
            <span>${t.icon}</span>
            <span>${t.name}</span>
          </button>
        `;
      }).join('');
    }

    function selectTemplate(id) {
      currentTemplateId = id;
      renderTemplateTabs();
      clearCanvasPrompt();
    }

    function renderPalette() {
      const container = document.getElementById('paletteSwatches');
      container.innerHTML = PALETTE_COLORS.map(color => {
        const isActive = (color.toLowerCase() === currentColor.toLowerCase() && currentTool !== 'eraser' && currentTool !== 'rainbow');
        return `
          <button onclick="setColor('${color}')" class="w-8 h-8 rounded-full border border-slate-200 shrink-0 transition active:scale-90 ${isActive ? 'color-swatch-active' : ''}" style="background-color: ${color};" title="${color}"></button>
        `;
      }).join('') + `
        <!-- Custom Color Picker -->
        <label class="w-8 h-8 rounded-full border-2 border-dashed border-pink-300 flex items-center justify-center shrink-0 cursor-pointer bg-pink-50 text-pink-600 hover:scale-105 transition" title="เลือกสีอื่นๆ">
          <i class="fa-solid fa-palette text-xs"></i>
          <input type="color" class="hidden" onchange="setColor(this.value)">
        </label>
      `;
    }

    function renderStickers() {
      const container = document.getElementById('stickersList');
      container.innerHTML = STICKERS.map(st => {
        const isActive = (st === selectedSticker);
        return `
          <button onclick="selectSticker('${st}')" class="w-9 h-9 rounded-xl text-lg flex items-center justify-center transition active:scale-90 border ${isActive ? 'bg-white border-pink-400 shadow-xs scale-110' : 'bg-amber-100/50 hover:bg-white border-transparent'}">
            ${st}
          </button>
        `;
      }).join('');
    }

    function selectSticker(st) {
      selectedSticker = st;
      renderStickers();
      playTone(460, 0.08, 'triangle');
    }

    function setColor(color) {
      currentColor = color;
      if (currentTool === 'eraser') setTool('brush');
      renderPalette();
      playTone(420, 0.05, 'sine');
    }

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
      const activeBtn = document.getElementById(`toolBtn_${tool}`);
      if (activeBtn) activeBtn.classList.add('active-tool');

      const stickerBox = document.getElementById('stickerPaletteBox');
      if (tool === 'sticker') {
        stickerBox.classList.remove('hidden');
      } else {
        stickerBox.classList.add('hidden');
      }

      renderPalette();
      playTone(360, 0.06, 'triangle');
    }

    function setBrushSize(size) {
      currentBrushSize = size;
      document.querySelectorAll('.size-btn').forEach(b => {
        b.classList.remove('active-tool', 'border-pink-400', 'bg-pink-50');
        b.classList.add('border-slate-200');
      });
      const activeSizeBtn = document.getElementById(`sizeBtn_${size}`);
      if (activeSizeBtn) {
        activeSizeBtn.classList.add('active-tool', 'border-pink-400', 'bg-pink-50');
        activeSizeBtn.classList.remove('border-slate-200');
      }
      playTone(480, 0.05, 'sine');
    }

    // 11. SAVE & REWARD
    function downloadArtwork() {
      const link = document.createElement('a');
      link.download = `Kidobits_Artwork_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      playTone(550, 0.15, 'triangle');
    }

    function finishDrawingReward() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 80,
          origin: { y: 0.6 }
        });
      }

      userStars += 5;
      localStorage.setItem('KB_STARS', userStars);
      document.getElementById('starsChip').textContent = userStars;

      if (window.KidobitsWallet) {
        try {
          KidobitsWallet.addReward({ stars: 5, coins: 25 });
        } catch (e) {}
      }

      document.getElementById('artWinModal').classList.remove('hidden');
    }

    function closeArtModal() {
      document.getElementById('artWinModal').classList.add('hidden');
    }

    // 12. INITIALIZATION ON DOM LOAD
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('starsChip').textContent = userStars;
      renderTemplateTabs();
      renderPalette();
      renderStickers();
      
      // Init Canvas after layout completes
      setTimeout(() => {
        initCanvas();
      }, 50);
    });
  </script>
