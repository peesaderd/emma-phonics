    function switchLevel(lv) {
      currentLevel = parseInt(lv, 10) || 1;
      
      // Update Tab Styles
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
      const activeTab = document.getElementById('tab-lv' + currentLevel);
      if (activeTab) activeTab.classList.add('tab-active');

      const conf = LEVEL_CONFIGS[currentLevel] || LEVEL_CONFIGS[1];

      // Update Warmup Banner visibility
      const warmupCard = document.getElementById('az-warmup-card');
      if (warmupCard) {
        warmupCard.style.display = conf.showWarmup ? 'flex' : 'none';
      }

      // Update Hero Card
      const heroCard = document.getElementById('hero-card');
      const heroMascot = document.getElementById('hero-mascot');
      const heroTitle = document.getElementById('hero-title');
      const heroSub = document.getElementById('hero-sub');
      const heroBar = document.getElementById('hero-bar');
      const heroProg = document.getElementById('hero-progress-text');
      const heroPercent = document.getElementById('hero-percent');
      const countBadge = document.getElementById('lesson-count-badge');

      heroCard.className = conf.heroGradient + " rounded-[24px] p-5 text-white shadow-lg relative overflow-hidden transition-all duration-300";
      heroMascot.textContent = conf.mascot;
      heroTitle.textContent = conf.title;
      heroSub.textContent = conf.sub;
      countBadge.textContent = conf.lessons.length + " บท";

      // Compute Passed count from localStorage / KidobitsLock
      let passedCount = 0;
      conf.lessons.forEach(item => {
        if (window.KidobitsLock && KidobitsLock.isCompleted('phonics', item.id)) {
          passedCount++;
        }
      });

      const pct = Math.round((passedCount / conf.lessons.length) * 100);
      heroBar.style.width = Math.max(pct, 12) + "%";
      heroProg.textContent = passedCount > 0 ? "✅ ผ่านแล้ว " + passedCount + "/" + conf.lessons.length : "⭐ เริ่มเล่นตามลำดับ";
      heroPercent.textContent = pct + "%";

      // Render Lessons List
      renderLessons(conf);

      // Update URL query string without reloading page
      try {
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('lv', currentLevel);
        window.history.replaceState({}, '', newUrl);
      } catch(e) {}
    }

    function renderLessons(conf) {
      const listEl = document.getElementById('lessons-list');
      listEl.innerHTML = conf.lessons.map((item, idx) => {
        const lessonIdx = idx + 1;
        const isUnlocked = window.KidobitsLock ? KidobitsLock.isUnlocked('phonics', lessonIdx) : (lessonIdx === 1);
        const isCompleted = window.KidobitsLock ? KidobitsLock.isCompleted('phonics', item.id) : false;

        if (!isUnlocked) {
          return `
            <div class="w-full text-left bg-slate-50/80 border border-dashed border-slate-200 rounded-[24px] p-4 flex items-center justify-between opacity-60 cursor-not-allowed select-none">
              <div class="flex items-center gap-3">
                <span class="w-11 h-11 rounded-2xl bg-slate-200/60 text-slate-400 grid place-items-center font-black text-sm shrink-0">
                  🔒
                </span>
                <div>
                  <div class="flex items-center gap-2 mb-0.5">
                    <span class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">${item.id}</span>
                    <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">ล็อค</span>
                  </div>
                  <h4 class="font-extrabold text-[15px] text-slate-400 leading-tight">${item.title}</h4>
                  <p class="text-xs text-slate-400 font-medium mt-0.5">${item.th}</p>
                </div>
              </div>
            </div>
          `;
        }

        return `
          <div onclick="playLesson('${item.id}')" 
               class="w-full text-left bg-white border border-[#F1EAF7] rounded-[24px] p-4 flex items-center justify-between hover:border-[#8B7CFF] hover:shadow-md active:scale-[0.98] transition cursor-pointer group shadow-xs">
            <div class="flex items-center gap-3">
              <span class="w-11 h-11 rounded-2xl ${conf.badgeBg} text-white grid place-items-center font-black text-sm shrink-0 shadow-sm group-hover:scale-105 transition">
                ${item.n}
              </span>
              <div>
                <div class="flex items-center gap-2 mb-0.5">
                  <span class="text-[11px] font-extrabold text-[#736393] uppercase tracking-wider">${item.id}</span>
                  ${isCompleted ? '<span class="text-[10px] font-extrabold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full flex items-center gap-0.5">⭐ ครบ 3 ดาว</span>' : '<span class="text-[10px] font-extrabold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full">พร้อมเล่น</span>'}
                </div>
                <h4 class="font-extrabold text-[15px] text-[#2D2342] leading-tight group-hover:text-[#8B7CFF] transition">${item.title}</h4>
                <p class="text-xs text-[#736393] font-medium mt-0.5">${item.th}</p>
                
                ${item.chips && item.chips.length ? `
                  <div class="flex items-center gap-1.5 flex-wrap mt-2">
                    ${item.chips.map(chip => `<span class="bg-[#F8F5FC] text-[#5B4B8A] text-[10px] font-bold px-2 py-0.5 rounded-md border border-[#ECE5F5]">${chip}</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="shrink-0 pl-2">
              <span class="w-9 h-9 rounded-full bg-[#F8F5FC] group-hover:bg-[#8B7CFF] group-hover:text-white text-[#736393] grid place-items-center transition">
                ➔
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    function playLesson(lessonId) {
      // Direct routing to the modern HTML5 Phonics Lesson Player (NO DEMO LINKS!)
      window.location.href = 'theme_phonicsLesson.html?lesson=' + encodeURIComponent(lessonId);
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
      // Sync wallet values if available
      try {
        if (window.KidobitsWallet) {
          const w = KidobitsWallet.get();
          document.getElementById('statStreak').textContent = w.streak || 5;
          document.getElementById('statStars').textContent = w.stars || 0;
          document.getElementById('statDiamonds').textContent = w.diamonds || 0;
        }
      } catch(e) {}

      // Check URL query param for starting level
      const q = new URLSearchParams(window.location.search);
      const startLv = parseInt(q.get('lv') || '1', 10);
      switchLevel(startLv);
    });
  </script>
</body>
</html>
