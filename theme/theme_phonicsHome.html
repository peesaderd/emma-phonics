      try {
        if (window.KidobitsWallet) {
          const w = KidobitsWallet.get();
          if (w.streak) document.getElementById('valStreak').textContent = w.streak;
          if (w.stars != null) document.getElementById('valDiamonds').textContent = w.stars + '/26';
