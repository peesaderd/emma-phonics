<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kidobits · Phonics 3 Levels</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8B7CFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Nunito', 'Mali', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FFFBF5] text-[#1A1A1A] antialiased">

  <!-- ================= OUTER SHELL (Responsive Desktop / Mobile Centering) ================= -->
  <div class="min-h-[100dvh] w-full flex justify-center items-start sm:items-center px-0 sm:px-4 py-0 sm:py-5" style="background: linear-gradient(180deg,#FDF0F5 0%,#EDE7FF 52%,#DFF5FF 100%);">
    
    <!-- ================= MOBILE APP FRAME (430px) ================= -->
    <div class="w-full max-w-[430px] sm:rounded-[36px] rounded-none overflow-hidden shadow-[0_24px_70px_rgba(90,60,140,.28)] flex flex-col h-[100dvh] sm:h-[860px] sm:max-h-[92vh] relative bg-white text-[#1A1A1A]">
      
      <!-- Top App Bar -->

        <a href="theme_home.html" class="bg-white border border-[#EBE3F5] px-3.5 py-1.5 rounded-full text-xs font-extrabold text-[#5B4B8A] shadow-sm hover:bg-[#F9F5FF] active:scale-95 transition">
          ← หน้าแรก
        </a>
        <div class="flex items-center gap-1.5">
          <span class="bg-white border border-[#EBE3F5] rounded-full px-2.5 py-1 text-xs font-extrabold flex items-center gap-1 shadow-sm">
            🔥 <span id="stat-streak">7</span>
          </span>
          <span class="bg-white border border-[#EBE3F5] rounded-full px-2.5 py-1 text-xs font-extrabold flex items-center gap-1 shadow-sm">

          </span>
          <span class="bg-[#E8FFF0] border border-[#BDE8CC] text-[#1B9A62] rounded-full px-2.5 py-1 text-[11px] font-extrabold flex items-center gap-1.5 shadow-sm">

            🔤
          </span>
          <div class="flex-1 min-w-0">
            <h2 class="text-[22px] font-extrabold leading-tight">Kidobits Phonics</h2>
            <p class="text-xs text-white/90 font-bold mt-0.5">3 ระดับ • 46 บทเรียนหลัก • ภาษาอังกฤษสำหรับเด็ก</p>

              <span class="bg-white/25 px-2 py-0.5 rounded-full text-[11px] font-extrabold">🎧 มีเสียง</span>
              <span class="bg-white/25 px-2 py-0.5 rounded-full text-[11px] font-extrabold">⭐ ฟรี</span>

          <span class="w-12 h-12 rounded-full bg-white grid place-items-center text-3xl shrink-0 shadow-sm">
            🐼

          <!-- ================= LEVEL 1 ================= -->
          <button onclick="location.href='theme_phonicsLevel.html'" class="w-full text-left rounded-[24px] p-4 text-white flex gap-3 items-center shadow-sm hover:opacity-95 active:scale-[0.98] transition cursor-pointer" style="background: #8B7CFF;">

              🐱
            </span>
            <span class="flex-1 min-w-0">
              <span class="text-[11px] font-extrabold opacity-90 uppercase tracking-wide">LEVEL 1</span>
              <b class="block leading-tight text-base font-extrabold">Letter Sounds & Early Blending</b>
              <span class="block text-xs opacity-90 font-medium">เสียงตัวอักษร & ผสมเสียงเบื้องต้น</span>
              <span class="block text-xs font-bold mt-1">12 บทเรียน • 12/12 พร้อม • ✅ ผ่าน 6/12</span>
              <span class="block h-2.5 bg-white/30 rounded-full mt-2 overflow-hidden">
                <span class="block h-full bg-white rounded-full" style="width: 50%;"></span>
              </span>
            </span>
            <span class="text-xl font-extrabold">→</span>
          </button>

          <!-- ================= LEVEL 2 ================= -->

              🐸
            </span>
            <span class="flex-1 min-w-0">
              <span class="text-[11px] font-extrabold opacity-90 uppercase tracking-wide">LEVEL 2</span>
              <b class="block leading-tight text-base font-extrabold">Blending & CVC Fluent Reader</b>
              <span class="block text-xs opacity-90 font-medium">ผสมเสียง & คำ CVC (บันได 4 ขั้น)</span>
              <span class="block text-xs font-bold mt-1">16 บทเรียน • 16/16 พร้อม • ✅ ผ่าน 3/16</span>
              <span class="block h-2.5 bg-white/30 rounded-full mt-2 overflow-hidden">
                <span class="block h-full bg-white rounded-full" style="width: 19%;"></span>
              </span>
            </span>
            <span class="text-xl font-extrabold">→</span>
          </button>

            <span class="w-14 h-14 rounded-full bg-white grid place-items-center text-3xl shrink-0 shadow-sm">
              🦊
            </span>
            <span class="flex-1 min-w-0">
              <span class="text-[11px] font-extrabold opacity-90 uppercase tracking-wide">LEVEL 3</span>

              </span>
            </span>
            <span class="text-xl font-extrabold">→</span>

          <span class="w-10 h-10 grid place-items-center rounded-full transition text-[#9A8FA8] hover:bg-slate-50">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
              <path d="M2 12h20"></path>
            </svg>
          </span>
          <span class="text-[10px] font-extrabold text-[#9A8FA8]">Chinese</span>
        </button>

        <!-- 5. Games -->
        <button onclick="window.location.href='theme_games.html'" class="flex flex-col items-center gap-0.5 min-w-[52px]" aria-label="Games">
          <span class="w-10 h-10 grid place-items-center rounded-full transition text-[#9A8FA8] hover:bg-slate-50">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" x2="10" y1="11" y2="11"></line>
              <line x1="8" x2="8" y1="9" y2="13"></line>
              <line x1="15" x2="15.01" y1="12" y2="12"></line>

          <span class="w-10 h-10 grid place-items-center rounded-full transition text-[#9A8FA8] hover:bg-slate-50">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    if ('serviceWorker' in navigator) {
