<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Kidobits · การแจ้งเตือนคนเก่ง</title>

  <!-- PWA & Mobile Settings -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8B7CFF">

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Prompt:wght@400;500;600;700;800;900&family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Prompt', 'Noto Sans Thai', -apple-system, sans-serif;
      background-color: #F8F9FD;
      color: #2D2342;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .font-display {
      font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif;
    }
    .card-shadow {
      box-shadow: 0 10px 25px rgba(45, 35, 66, 0.06);
    }
    .purple-glow {
      box-shadow: 0 10px 28px rgba(139, 124, 255, 0.24);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="/theme/js/kidobits_auth.js"></script>
</head>
<body class="flex justify-center min-h-screen bg-slate-100">

  <!-- Mobile Container (Max 430px) -->
  <div class="w-full max-w-[430px] min-h-screen bg-white relative flex flex-col justify-between shadow-2xl pb-24">

    <div class="px-5 pt-7">

      <!-- ================= 1. HEADER ROW ================= -->
      <header class="flex items-center justify-between gap-3 pt-2 pb-3">
        <div class="flex items-center gap-3">
          <button onclick="window.location.href='theme_home.html'" class="w-10 h-10 rounded-full bg-[#F5F0FF] hover:bg-[#EDE5FA] grid place-items-center text-[#6C5CE7] transition active:scale-95 cursor-pointer shadow-sm" aria-label="Back to Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5"></path>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-bold text-[#9A8FA8]">🔔 NOTIFICATIONS</span>
              <span id="unreadHeaderBadge" class="text-[9px] font-black text-white px-2 py-0.5 rounded-full bg-[#FF5B8A]">3 ข้อความใหม่</span>
            </div>
            <h1 class="text-xl font-extrabold text-[#2D2342] leading-tight">
              การแจ้งเตือนคนเก่ง 📬
            </h1>
          </div>
        </div>

        <!-- Mark All Read Button -->
        <button onclick="markAllAsRead()" class="text-[11px] font-bold text-[#6C5CE7] bg-[#F5F0FF] hover:bg-[#EDE5FA] px-2.5 py-1.5 rounded-xl transition active:scale-95 shrink-0">
          อ่านทั้งหมด ✓
        </button>
      </header>

      <!-- ================= 2. FILTER PILLS ================= -->
      <div class="mt-2.5 flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
        <button onclick="switchType('all')" id="tab-all" class="type-pill px-3 py-1.5 rounded-xl text-[11px] font-black bg-[#8B7CFF] text-white shadow-xs shrink-0 transition">
          🌈 ทั้งหมด
        </button>
        <button onclick="switchType('reward')" id="tab-reward" class="type-pill px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-white border border-[#E9E0FF] text-[#7B7488] shrink-0 transition">
          🏆 ดาว & รางวัล
        </button>
        <button onclick="switchType('learning')" id="tab-learning" class="type-pill px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-white border border-[#E9E0FF] text-[#7B7488] shrink-0 transition">
          📚 บทเรียน
        </button>
        <button onclick="switchType('announcement')" id="tab-announcement" class="type-pill px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-white border border-[#E9E0FF] text-[#7B7488] shrink-0 transition">
          📢 ข่าวสาร
        </button>
      </div>

      <!-- ================= 3. NOTIFICATION LIST ================= -->
      <div id="notifListContainer" class="mt-4 space-y-2.5">
        <div class="text-center py-10 text-xs text-[#9A8FA8] font-bold">
          กำลังโหลดการแจ้งเตือน...
        </div>
      </div>

    </div>

    <!-- ================= 4. FLOATING BOTTOM NAV DOCK ================= -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-white/95 backdrop-blur-md border-t border-[#EAE4F2] px-3 py-2 flex items-center justify-between z-50 shadow-lg" aria-label="Bottom Navigation">
      <!-- Home -->
      <button onclick="window.location.href='theme_home.html'" class="flex flex-col items-center gap-0.5 min-w-[50px] text-[#9A8FA8] hover:text-black transition">
        <span class="w-10 h-10 grid place-items-center rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
            <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
        </span>
        <span class="text-[10px] font-extrabold text-[#9A8FA8]">Home</span>
      </button>

      <!-- Phonics -->
      <button onclick="window.location.href='theme_phonicsLevel.html'" class="flex flex-col items-center gap-0.5 min-w-[50px] text-[#9A8FA8] hover:text-black transition">
        <span class="w-10 h-10 grid place-items-center rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10"></path>
            <path d="M6 10h10"></path>
          </svg>
        </span>
        <span class="text-[10px] font-extrabold text-[#9A8FA8]">Phonics</span>
      </button>

      <!-- Math -->
      <button onclick="window.location.href='theme_math_lobby.html'" class="flex flex-col items-center gap-0.5 min-w-[50px] text-[#9A8FA8] hover:text-black transition">
        <span class="w-10 h-10 grid place-items-center rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="16" height="20" x="4" y="2" rx="2"></rect>
            <line x1="8" x2="16" y1="6" y2="6"></line>
            <line x1="16" x2="16" y1="14" y2="18"></line>
            <path d="M16 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M8 14h.01"></path>
            <path d="M12 18h.01"></path>
            <path d="M8 18h.01"></path>
          </svg>
        </span>
        <span class="text-[10px] font-extrabold text-[#9A8FA8]">Math</span>
      </button>

      <!-- Chinese -->
      <button onclick="window.location.href='theme_chinese_lobby.html'" class="flex flex-col items-center gap-0.5 min-w-[50px] text-[#9A8FA8] hover:text-black transition">
        <span class="w-10 h-10 grid place-items-center rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
          </svg>
        </span>
        <span class="text-[10px] font-extrabold text-[#9A8FA8]">Chinese</span>
      </button>

      <!-- Games -->
      <button onclick="window.location.href='theme_games.html'" class="flex flex-col items-center gap-0.5 min-w-[50px] text-[#9A8FA8] hover:text-black transition">
        <span class="w-10 h-10 grid place-items-center rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" x2="10" y1="11" y2="11"></line>
            <line x1="8" x2="8" y1="9" y2="13"></line>
            <line x1="15" x2="15.01" y1="12" y2="12"></line>
            <line x1="18" x2="18.01" y1="10" y2="10"></line>
            <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path>
          </svg>
        </span>
        <span class="text-[10px] font-extrabold text-[#9A8FA8]">Games</span>
      </button>

      <!-- Rank -->
      <button onclick="window.location.href='theme_leaderboard.html'" class="flex flex-col items-center gap-0.5 min-w-[50px] text-[#9A8FA8] hover:text-[#8B7CFF] transition">
        <span class="w-10 h-10 grid place-items-center rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.34"></path>
            <path d="M14 14.66V17c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-2.34"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
          </svg>
        </span>
        <span class="text-[10px] font-extrabold text-[#9A8FA8]">Rank</span>
      </button>
    </nav>

  </div>

  <script>
    let currentType = 'all';
    let currentUserId = 'line_peesaderd';

    function initUser() {
      try {
        const stored = localStorage.getItem('kidobits_user');
        if (stored) {
          const u = JSON.parse(stored);
          if (u.userId) currentUserId = u.userId;
        }
      } catch (e) {}
    }

    function switchType(t) {
      currentType = t;
      document.querySelectorAll('.type-pill').forEach(btn => {
        btn.className = 'type-pill px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-white border border-[#E9E0FF] text-[#7B7488] shrink-0 transition';
      });
      const activeBtn = document.getElementById(`tab-${t}`);
      if (activeBtn) {
        activeBtn.className = 'type-pill px-3 py-1.5 rounded-xl text-[11px] font-black bg-[#8B7CFF] text-white shadow-xs shrink-0 transition';
      }
      loadNotifications();
    }

    async function loadNotifications() {
      try {
        let url = `/api/v1/notifications?user_id=${encodeURIComponent(currentUserId)}`;
        if (currentType !== 'all') {
          url += `&type=${currentType}`;
        }
        const res = await fetch(url);
        const data = await res.json();
        
        // Update Header Badge
        const badgeEl = document.getElementById('unreadHeaderBadge');
        if (data.unread_count > 0) {
          badgeEl.textContent = `${data.unread_count} ข้อความใหม่`;
          badgeEl.className = 'text-[9px] font-black text-white px-2 py-0.5 rounded-full bg-[#FF5B8A]';
        } else {
          badgeEl.textContent = 'อ่านครบแล้ว';
          badgeEl.className = 'text-[9px] font-black text-slate-500 px-2 py-0.5 rounded-full bg-slate-100';
        }

        renderNotifications(data.notifications || []);
      } catch (err) {
        console.error("Notifications fetch error:", err);
      }
    }

    function renderNotifications(items) {
      const container = document.getElementById('notifListContainer');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12">
            <span class="text-4xl block mb-2">📭</span>
            <p class="text-xs font-bold text-[#9A8FA8]">ไม่มีการแจ้งเตือนในหมวดนี้</p>
          </div>
        `;
        return;
      }

      items.forEach(n => {
        const card = document.createElement('div');
        const isUnread = !n.is_read;
        card.className = `p-3.5 rounded-2xl border transition-all ${
          isUnread 
          ? 'bg-[#F9F7FF] border-[#8B7CFF]/50 card-shadow relative' 
          : 'bg-white border-[#F0EBF8]'
        }`;

        let iconBg = 'bg-[#EDE5FA] text-[#8B7CFF]';
        if (n.type === 'reward') iconBg = 'bg-[#FFF9E6] text-[#D97706]';
        else if (n.type === 'learning') iconBg = 'bg-[#FFF0F5] text-[#FF5B8A]';
        else if (n.type === 'announcement') iconBg = 'bg-[#EBF8FF] text-[#0284C7]';

        card.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-2xl ${iconBg} grid place-items-center text-xl shrink-0 shadow-xs">
              ${n.icon || '🔔'}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-1">
                <h3 class="font-black text-xs text-[#2D2342] truncate ${isUnread ? 'font-extrabold' : ''}">
                  ${n.title}
                </h3>
                ${isUnread ? '<span class="w-2 h-2 rounded-full bg-[#FF5B8A] shrink-0"></span>' : ''}
              </div>
              <p class="text-[11px] text-[#7B7488] font-medium leading-relaxed mt-1">
                ${n.message}
              </p>
              ${n.action_url ? `
                <div class="mt-2.5 flex items-center justify-between">
                  <a href="${n.action_url}" onclick="markAsRead('${n.id}')" class="inline-flex items-center gap-1 text-[11px] font-black text-[#8B7CFF] hover:underline bg-white px-2.5 py-1 rounded-lg border border-[#E9E0FF] shadow-xs active:scale-95">
                    <span>${n.action_label || 'เปิดดู'}</span>
                    <span>▶</span>
                  </a>
                  <button onclick="markAsRead('${n.id}')" class="text-[10px] text-[#9A8FA8] hover:text-[#2D2342] font-semibold">
                    ${isUnread ? 'ทำเครื่องหมายว่าอ่านแล้ว' : 'อ่านแล้ว'}
                  </button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function markAsRead(id) {
      await fetch('/api/v1/notifications/read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      loadNotifications();
    }

    async function markAllAsRead() {
      await fetch('/api/v1/notifications/read-all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: currentUserId })
      });
      loadNotifications();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initUser();
      loadNotifications();
    });
  </script>
</body>
</html>
