        const isTierUnlocked = window.KidobitsLock ? KidobitsLock.isChineseTierUnlocked(tier.key) : (tier.key === 'early');

        // Tier Section Wrapper (Headers stay full-width, not in grid)
        const tierSection = document.createElement('section');
        tierSection.className = 'w-full flex flex-col gap-2';

        // Section header (Full width, independent of cards grid)
        const secHeader = document.createElement('div');
        secHeader.className = 'w-full flex items-center justify-between pt-2 pb-1 text-xs font-bold text-slate-700';
        secHeader.innerHTML = `
          <span class="font-bold flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
            <span>${tier.label}</span>
          </span>
          <span class="px-2 py-0.5 rounded-full bg-red-50 text-[10px] font-black text-red-600 border border-red-100">${tier.tag}</span>
        `;
        tierSection.appendChild(secHeader);

        // Cards grid for this tier
        const cardsGrid = document.createElement('div');
        cardsGrid.className = 'chinese-tier-grid grid grid-cols-1 gap-2.5';
        tierSection.appendChild(cardsGrid);

        items.forEach((les, idx) => {
          const starsKey = 'kidobits_cn_stars_' + les.id;
          const savedStars = parseInt(localStorage.getItem(starsKey) || '0', 10);
          totalStars += savedStars;

          let starsHtml = '';
          for (let i = 1; i <= 3; i++) {
            if (i <= savedStars) {
              starsHtml += '<span class="text-amber-400 text-xs">⭐</span>';
            } else {
              starsHtml += '<span class="text-slate-200 text-xs">★</span>';
            }
          }

          const lessonIdx = idx + 1;
          const isUnlocked = isTierUnlocked && (window.KidobitsLock ? KidobitsLock.isUnlocked('chinese', tier.key, lessonIdx) : (lessonIdx === 1));
          const isCompleted = window.KidobitsLock ? KidobitsLock.isCompleted('chinese', tier.key, les.id) : (savedStars > 0);

          const card = document.createElement('div');
          if (!isUnlocked) {
            card.className = 'w-full bg-slate-50/80 rounded-2xl p-3.5 border border-dashed border-slate-200 shadow-xs opacity-60 flex flex-col gap-2 cursor-pointer select-none transition';
            card.onclick = () => {
              if (window.KidobitsLock) KidobitsLock.shakeAndNotify(card, les.title);
            };
            card.innerHTML = `
              <div class="flex items-start gap-3 w-full">
                <div class="w-12 h-12 rounded-2xl bg-slate-200 flex items-center justify-center text-xl text-slate-400 shrink-0">
                  🔒
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-1 mb-0.5">
                    <span class="px-2 py-0.5 rounded-md bg-slate-100 text-[10px] font-black text-slate-500">${les.id}</span>
                    <span class="text-[10px] text-slate-400 font-bold">🔒 ล็อคอยู่</span>
                  </div>
                  <h3 class="font-chinese text-sm font-bold text-slate-600 truncate">${les.title}</h3>
                  <p class="text-[10px] text-slate-400 font-semibold mt-0.5">ผ่านบทเรียนก่อนหน้าเพื่อปลดล็อค</p>
                </div>
              </div>
            `;
            cardsGrid.appendChild(card);
            return;
          }

          // Unlocked Chinese Card
          card.className = 'btn-press w-full bg-white rounded-2xl p-3.5 border border-slate-100 shadow-sm hover:shadow-md hover:border-red-200 transition-all flex flex-col gap-2 cursor-pointer';
          card.onclick = () => {
            window.location.href = `/chinese.html?id=${les.id}`;
          };

          card.innerHTML = `
            <div class="flex items-start gap-3 w-full">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-red-400 to-orange-500 flex items-center justify-center text-2xl shadow-sm text-white shrink-0">
                ${les.icon || '🐼'}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-1 mb-0.5">
                  <div class="flex items-center gap-1.5">
                    <span class="px-2 py-0.5 rounded-md bg-red-50 text-[10px] font-black text-red-600 border border-red-100">${les.id}</span>
                    <span class="text-[10px] font-bold text-slate-400">${les.level}</span>
                  </div>
                  <div class="flex items-center gap-0.5">${starsHtml}</div>
                </div>
                <h3 class="font-chinese text-sm font-bold text-slate-800 truncate">${les.title}</h3>
                <p class="text-[11px] text-slate-400 truncate">${les.goal_th || ''}</p>
              </div>
            </div>
            <!-- 4 Skills Indicators -->
            <div class="flex items-center gap-1.5 flex-wrap pt-2 border-t border-slate-50 text-[10px] font-semibold text-slate-600">
              <span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-lg bg-red-50 text-red-700">🎧 ฟัง</span>
              <span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-lg bg-orange-50 text-orange-700">🗣️ พูด</span>
              <span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-lg bg-amber-50 text-amber-700">📖 อ่าน</span>
              <span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-700">✍️ เขียน</span>
            </div>
          `;

          cardsGrid.appendChild(card);
        });

        container.appendChild(tierSection);
      });

      const starsChip = document.getElementById('starsChip');
      if (starsChip && totalStars > 0) {
        starsChip.textContent = totalStars;
      }
    }

    function filterChinese(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => {
        b.className = 'filter-tab flex-1 py-1.5 rounded-xl text-slate-500 hover:bg-slate-50 text-center transition';
      });

      const activeBtn = filter === 'all' ? document.getElementById('tabAll')
        : filter === 'early' ? document.getElementById('tabEarly')
        : filter === 'lower' ? document.getElementById('tabPLow')
        : document.getElementById('tabPUpp');

      if (activeBtn) {
        activeBtn.className = 'filter-tab flex-1 py-1.5 rounded-xl bg-red-500 text-white font-black text-center shadow-xs transition';
      }

      renderLessons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderLessons();
    });

    function checkChineseResume() {
      if (!window.KidobitsResume) return;
      KidobitsResume.renderBanner({
        storageKey: 'kidobits_chinese_progress',
        containerId: 'chineseResumeBannerContainer',
        theme: 'red',
        onResume: function(act) {
          window.location.href = `/chinese.html?id=${act.lessonId}`;
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkChineseResume();
    });

  </script>
  <script src="/theme/js/kidobits_dynamic_island.js"></script>
</body>
</html>
