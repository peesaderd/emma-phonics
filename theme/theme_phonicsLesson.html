    body {
      font-family: 'Prompt', 'Noto Sans Thai', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: floaty 3s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 201, 60, 0.7); }
      50% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(255, 201, 60, 0); }
    }
    .chip-demo {
      background-color: #FFD966 !important;
      color: #2D2A4A !important;
      animation: pulseGlow 0.45s ease-in-out;
      font-weight: 900 !important;
      border-color: #FFC93C !important;
    }
    /* Start Cover Overlay */
    .tutorcover {
      position: absolute;
      inset: 0;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      padding: 24px;
      backdrop-filter: blur(8px);
      background: rgba(45, 30, 80, 0.45);
    }
    .tutorcover.gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .tcinner {
      background: #FFFDF8;
      border-radius: 28px;
      padding: 28px 22px;
      text-align: center;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 20px 50px rgba(60, 30, 120, 0.35);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  
    /* Floating Continue Toast (ยกมาจาก v2/lesson.html) */
    .resumetoast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 24px;
      z-index: 9999;
      background: #1E9E5A;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      display: flex;
      gap: 10px;
      align-items: center;
      max-width: 92vw;
      animation: toastFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transition: opacity 0.35s ease, transform 0.35s ease;
      white-space: nowrap;
    }
    .resumetoast button {
      background: rgba(255, 255, 255, 0.22);
      border: 0;
      color: #fff;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .resumetoast button:hover {
      background: rgba(255, 255, 255, 0.38);
    }
    .resumetoast button:active {
      transform: scale(0.95);
    }
    .resumetoast.toast-out {
      opacity: 0;
      transform: translate(-50%, 15px);
      pointer-events: none;
    }
    @keyframes toastFadeIn {
      from { opacity: 0; transform: translate(-50%, 15px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>

    /* -------------------------------------------------------------
       AUDIO ENGINE (Non-blocking, Sequential Script Queue)
       ------------------------------------------------------------- */
    let AC = null;
    let audioUnlocked = false;
    let currentAudio = null;
    let scriptSeq = 0;

    function unlockAudio() {
      if (audioUnlocked) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) {
          AC = AC || new Ctx();
          if (AC.state === 'suspended') AC.resume();
          const buf = AC.createBuffer(1, 1, 22050);
          const src = AC.createBufferSource();
          src.buffer = buf;
          src.connect(AC.destination);
          src.start(0);
        }
        audioUnlocked = true;
      } catch (e) {}
    }

    ['touchstart', 'touchend', 'click', 'pointerdown', 'keydown'].forEach(evt => {
      document.addEventListener(evt, unlockAudio, { passive: true });
    });

    function showSoundBadge(txt) {
      const hint = document.getElementById('sound-hint-pill');
      const hintT = document.getElementById('hint-text');
      if (hint && hintT) {
        hintT.textContent = txt;
        hint.classList.remove('hidden');
        clearTimeout(window.__badgeTimer);
        window.__badgeTimer = setTimeout(() => hint.classList.add('hidden'), 2200);
      }
    }

    function stopAllAudio() {
      scriptSeq++;
      if (currentAudio) {
        try {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        } catch (e) {}
        currentAudio = null;
      }
    }

    function playAudio(path, label, onEnd) {
      unlockAudio();
      stopAllAudio();
      const mySeq = scriptSeq;

      if (label) showSoundBadge(label);

      const realPath = path.startsWith('/') ? path : `/kidobits/v2/audio/${path}`;
      const a = new Audio(realPath);
      a.setAttribute('playsinline', '');
      a.preload = 'auto';
      a.volume = 1;

      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        if (mySeq === scriptSeq && typeof onEnd === 'function') {
          onEnd();
        }
      };

      a.addEventListener('ended', done);
      a.addEventListener('error', done);

      setTimeout(() => {
        if (a.currentTime > 0.05) return;
        done();
      }, 1500);

      const p = a.play();
      if (p && p.catch) {
        p.catch(() => {
          try {
            unlockAudio();
            a.play().catch(done);
          } catch(e) {
            done();
          }
        });
      }

      currentAudio = a;
      window.currentAudio = a;
      return a;
    }

    // Play Sequential Audio Script returned from Backend API
    function playAudioScript(scriptList, onComplete) {
      if (!scriptList || !scriptList.length) {
        if (onComplete) onComplete();
        return;
      }

      stopAllAudio();
      const mySeq = ++scriptSeq;
      let i = 0;

      function playNextItem() {
        if (mySeq !== scriptSeq) return;
        if (i >= scriptList.length) {
          if (onComplete) onComplete();
          return;
        }

        const item = scriptList[i++];
        const filePath = item.say;
        const wait = (item.wait !== false);

        const a = new Audio(filePath);
        a.setAttribute('playsinline', '');
        a.volume = 1;

        let finished = false;
        const stepDone = () => {
          if (finished) return;
          finished = true;
          if (wait) {
            setTimeout(playNextItem, 250);
          }
        };

        a.addEventListener('ended', stepDone);
        a.addEventListener('error', stepDone);
        setTimeout(() => { if (a.currentTime > 0.05) return; stepDone(); }, 2000);

        a.play().catch(stepDone);
        currentAudio = a;
        window.currentAudio = a;

        if (!wait) {
          setTimeout(playNextItem, 300);
        }
      }

      playNextItem();
    }

    /* -------------------------------------------------------------
       API CALLS (open, answer, advance)
       ------------------------------------------------------------- */
    async function openSession(lid, targetStep = null) {
      try {
        const res = await fetch(`${API_BASE}/session/open`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lesson: lid })
        });
        const data = await res.json();
        if (!data || !data.ok) throw new Error('Cannot open session');

        currentSessionId = data.session; window.currentSessionId = currentSessionId;

        // If resuming to targetStep > 1, jump immediately without playing step 1!
        if (targetStep && targetStep > 1 && targetStep <= 5) {
          await jumpToStep(targetStep);
          return;
        }

        currentItem = data.item; window.currentItem = currentItem;
        currentExpect = data.expect;
        currentScript = data.script || [];
        currentStepNo = (data.progress && data.progress.step) ? data.progress.step : 1;
        totalStepCount = (data.progress && data.progress.step_count) ? data.progress.step_count : 5;
        progSaveLocal(currentStepNo, currentItem ? (currentItem.index || 0) : 0);

        // Sync progress to API
        try {
          if (window.KidobitsWallet) {
            KidobitsWallet.saveProgress({
              lessonId: LID,
              step: currentStepNo,
              itemIndex: (currentItem ? currentItem.index || 0 : 0),
              totalSteps: totalStepCount,
              done: false
            });
          }
        } catch(e) {}

        typedLetters = [];
        isCorrect = false;
        completedSteps = [];
        isLessonDone = false;

        if (Array.isArray(data.completed_steps)) {
          data.completed_steps.forEach(st => markStepCompleted(st));
        }

        renderStepTabs();
        renderCurrentStep();

        // Sync progress to API
        try {
          if (window.KidobitsWallet) {
            KidobitsWallet.saveProgress({
              lessonId: LID,
              step: currentStepNo,
              itemIndex: (currentItem ? currentItem.index || 0 : 0),
              totalSteps: totalStepCount,
              done: false
            });
          }
        } catch(e) {}

        // Play initial audio script from API (Filter out word spoiler for Step 1 Blending)
        let script1 = (currentItem && currentItem.step === 1)
          ? (currentScript || []).filter(it => !String(typeof it === 'string' ? it : (it.say || '')).includes('word_'))
          : currentScript;

        // Hello friends greeting filter: Only play once per session
        try {
          const hasGreeted = sessionStorage.getItem('kidobits_has_greeted') === '1';
          if (hasGreeted) {
            script1 = (script1 || []).filter(it => {
              const u = String(typeof it === 'string' ? it : (it.say || ''));
              return !u.includes('teach_intro');
            });
          } else {
            const hasIntro = (script1 || []).some(it => {
              const u = String(typeof it === 'string' ? it : (it.say || ''));
              return u.includes('teach_intro');
            });
            if (hasIntro) {
              sessionStorage.setItem('kidobits_has_greeted', '1');
            }
          }
        } catch(e) { console.warn('sessionStorage error', e); }
        playAudioScript(script1, () => {
          if (currentItem && currentItem.step === 1) {
            runTeacherSpellDemo();
          } else if (currentItem && currentItem.step === 4) {
            setTimeout(startMicStep4, 400);
          } else if (currentItem && currentItem.step === 5) {
            setTimeout(startMicStep5, 400);
          }
        });
      } catch (err) {
        console.error('Session open error:', err);
      }
    }

    async function submitAnswer(givenInput, extraPayload = {}) {
      if (!currentSessionId) return;
      try {
        const payload = Object.assign({ session: currentSessionId, input: givenInput }, extraPayload);
        const res = await fetch(`${API_BASE}/session/answer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data || !data.ok) return;

        if (data.correct) {
          isCorrect = true;
          coins += 10;
          document.getElementById('stat-coins').textContent = coins;

          const isLastItemOfStep = currentItem && ((currentItem.index + 1) >= (currentItem.total || 5));
          if (data.done || (data.next && data.next.step !== currentItem.step) || isLastItemOfStep) {
            markStepCompleted(currentItem.step);
          }
          if (Array.isArray(data.completed_steps)) {
            data.completed_steps.forEach(st => markStepCompleted(st));
          }

          renderStepTabs();
          renderCurrentStep();

          // In Step 1 (Blending): Speak the blended target word first, then play praise!
          if (currentItem && currentItem.step === 1) {
            setTimeout(() => {
              playTargetWord(() => {
                setTimeout(() => {
                  playAudioScript(data.script, () => {
                    setTimeout(advanceNextItem, 800);
                  });
                }, 300);
              });
            }, 300);
          } else {
            // Steps 2-5: Play praise audio script directly
            playAudioScript(data.script, () => {
              setTimeout(advanceNextItem, 800);
            });
          }
        } else {
          showSoundBadge('ลองอีกครั้งนะ 🙂');
          playAudioScript(data.script);
        }
      } catch (err) {
        console.error('Answer submission error:', err);
      }
    }

    async function advanceNextItem(force = false) {
      if (!currentSessionId) return;
      stopAllAudio();
      micAttemptId++;
      try {
        const res = await fetch(`${API_BASE}/session/advance`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: currentSessionId, force: !!force })
        });
        const data = await res.json();
        if (!data || !data.ok) {
          if (!force) {
            return advanceNextItem(true);
          }
          return;
        }

        const prevStep = currentItem ? currentItem.step : null;

        if (data.done) {
          isLessonDone = true;
          progSaveLocal(currentStepNo, 0, true);
          if (prevStep) markStepCompleted(prevStep);
          for (let i = 0; i < 5; i++) markStepCompleted(i);
          if (Array.isArray(data.completed_steps)) {
            data.completed_steps.forEach(st => markStepCompleted(st));
          }
          renderStepTabs();
          renderSummary();
          return;
        }

        currentItem = data.item; window.currentItem = currentItem;
        currentExpect = data.expect;
        currentScript = data.script || [];
        currentStepNo = (data.progress && data.progress.step) ? data.progress.step : currentStepNo;
        progSaveLocal(currentStepNo, currentItem ? (currentItem.index || 0) : 0);

        if (prevStep && currentItem && currentItem.step !== prevStep) {
          markStepCompleted(prevStep);
        }
        if (Array.isArray(data.completed_steps)) {
          data.completed_steps.forEach(st => markStepCompleted(st));
        }

        typedLetters = [];
        isCorrect = false;

        renderStepTabs();
        renderCurrentStep();

        // Play audio script of next item (Filter out word spoiler for Step 1 Blending)
        const script2 = (currentItem && currentItem.step === 1)
          ? (currentScript || []).filter(it => !String(typeof it === 'string' ? it : (it.say || '')).includes('word_'))
          : currentScript;
        playAudioScript(script2, () => {
          if (currentItem && currentItem.step === 1) {
            runTeacherSpellDemo();
          } else if (currentItem && currentItem.step === 4) {
            setTimeout(startMicStep4, 400);
          } else if (currentItem && currentItem.step === 5) {
            setTimeout(startMicStep5, 400);
          }
        });
      } catch (err) {
        console.error('Advance error:', err);
      }
    }

    async function jumpToStep(targetStep) {
      if (!currentSessionId) return;
      stopAllAudio();
      micAttemptId++;
      try {
        const res = await fetch(`${API_BASE}/session/jump`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: currentSessionId, step: targetStep, index: 0 })
        });
        const data = await res.json();
        if (!data || !data.ok) {
          console.warn('Jump rejected:', data);
          return;
        }

        currentItem = data.item; window.currentItem = currentItem;
        currentExpect = data.expect;
        currentScript = data.script || [];
        currentStepNo = (data.progress && data.progress.step) ? data.progress.step : currentStepNo;
        progSaveLocal(currentStepNo, 0);

        if (Array.isArray(data.completed_steps)) {
          data.completed_steps.forEach(st => markStepCompleted(st));
        }

        typedLetters = [];
        isCorrect = false;

        renderStepTabs();
        renderCurrentStep();

        const script3 = (currentItem && currentItem.step === 1)
          ? (currentScript || []).filter(it => !String(typeof it === 'string' ? it : (it.say || '')).includes('word_'))
          : currentScript;
        playAudioScript(script3, () => {
          if (currentItem && currentItem.step === 1) {
            runTeacherSpellDemo();
          } else if (currentItem && currentItem.step === 4) {
            setTimeout(startMicStep4, 400);
          } else if (currentItem && currentItem.step === 5) {
            setTimeout(startMicStep5, 400);
          }
        });
      } catch (err) {
        console.error('Jump error:', err);
      }
    }

    function replayCurrentScript() {
      unlockAudio();
      if (currentItem && currentItem.step === 1) {
        runTeacherSpellDemo();
        return;
      }
      if (currentScript && currentScript.length) {
        playAudioScript(currentScript, () => {
          if (currentItem && currentItem.step === 1) {
            runTeacherSpellDemo();
          }
        });
      } else if (currentItem && currentItem.word) {
        playAudio(`word_${currentItem.word}.mp3`, `🔊 ${currentItem.word}`);
      }
    }

    function checkIsLevel1() {
      const lid = (currentItem && currentItem.lesson_id) || new URLSearchParams(location.search).get('id') || '';
      const lv = (currentItem && currentItem.level) || 0;
      return lv === 1 || lid.toUpperCase().startsWith('L1');
    }

    // Helper: Play isolated phonics sound (Active for Levels 1, 2, and 3 with safe fallback)
    function playLetterSound(l, onEnd) {
      const clean = String(l || '').toLowerCase().trim().replace(/[^a-z0-9]/g, '');
      const phonicsUrl = `/kidobits/v2/audio/phonics_bank/ph_${clean}.mp3`;
      playAudio(phonicsUrl, `เสียง /${clean}/`, onEnd, () => {
        // Fallback to legacy sp_ if missing
        playAudio(`sp_${clean}.mp3`, `เสียง /${clean}/`, onEnd, onEnd);
      });
    }

    // Teacher Spell Demo in Step 1 (Blending: sound out phonemes -> then blend into full word)
    function runTeacherSpellDemo() {
      if (!currentItem || currentItem.step !== 1) return;
      const letters = currentItem.letters || currentItem.word.split('');
      const word = currentItem.word;

      let idx = 0;
      function spellNext() {
        if (!currentItem || currentItem.step !== 1) return;
        if (idx < letters.length) {
          const l = letters[idx];
          const chip = document.getElementById(`btn-letter-${l}`);
          if (chip) chip.classList.add('chip-demo');
          playLetterSound(l, () => {
            if (chip) chip.classList.remove('chip-demo');
            idx++;
            setTimeout(spellNext, 350);
          });
        } else {
          // All letters sounded out -> Blend into full target word!
          setTimeout(() => {
            if (!currentItem || currentItem.step !== 1) return;
            playTargetWord();
          }, 350);
        }
      }
      setTimeout(spellNext, 300);
    }

    /* -------------------------------------------------------------
       UI RENDERING
       ------------------------------------------------------------- */
    function renderStepTabs() {
      const tabsEl = document.getElementById('step-tabs');
      if (!tabsEl) return;
      const curStepIdx = (currentItem && !isLessonDone) ? (currentItem.step - 1) : -1;

      tabsEl.innerHTML = STEPS.map((s, idx) => {
        const stepNum = idx + 1;
        const isActive = (idx === curStepIdx);
        const isDone = completedSteps.includes(idx);
        const activeBg = isLv2 ? "bg-[#7ED9A8] text-white shadow-sm ring-2 ring-[#1B9A62]"
          : isLv3 ? "bg-[#6C5CE7] text-white shadow-sm ring-2 ring-[#4834D4]"
          : isLv4 ? "bg-[#FF9F43] text-white shadow-sm ring-2 ring-[#EE5253]"
          : isLv5 ? "bg-[#00CEC9] text-white shadow-sm ring-2 ring-[#0984E3]"
          : isLv6 ? "bg-[#A29BFE] text-white shadow-sm ring-2 ring-[#FD79A8]"
          : "bg-[#8B7CFF] text-white shadow-sm ring-2 ring-[#5B4B8A]";
        const doneBg = "bg-[#D9F8E7] text-[#1B9A62] border border-[#BDE8CC] hover:bg-[#c2f3d6]";
        const idleBg = "bg-white border border-[#EBE3F5] text-[#5B4B8A] hover:bg-[#F4F1FA]";

        return `
          <button onclick="jumpToStep(${stepNum})" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-extrabold cursor-pointer transition active:scale-95 ${isActive ? activeBg : isDone ? doneBg : idleBg}">
            ${stepNum}. ${s} ${isDone ? '✓' : ''}
          </button>
        `;
      }).join('');

      if (isLessonDone || completedSteps.length === 5) {
        document.getElementById('step-progress-bar').style.width = '100%';
        document.getElementById('step-progress-label').textContent = 'สำเร็จทุกขั้นตอน! (5/5)';
      } else {
        const activeIdx = curStepIdx >= 0 ? curStepIdx : (currentItem ? currentItem.step - 1 : 0);
        const stepPercent = Math.min(100, Math.round(((activeIdx + 1) / 5) * 100));
        document.getElementById('step-progress-bar').style.width = `${stepPercent}%`;
        document.getElementById('step-progress-label').textContent = `ขั้นที่ ${activeIdx + 1}/5 (${STEPS[activeIdx] || ''})`;
      }

      if (currentItem && !isLessonDone) {
        const _rt = document.getElementById('resume-text');
        if (_rt) _rt.textContent = `เล่นต่อ: ขั้นที่ ${currentItem.step} • ข้อ ${(currentItem.index || 0) + 1}/${currentItem.total || 5}`;
      }
    }

        const slotsHtml = letters.map((l, i) => `

        box.innerHTML = `

              <button onclick="handleTypeLetter('${l}')"

        const rawOpts = (currentItem.options && currentItem.options.length)

          : [{ w: targetWord, e: '🎯' }, { w: 'sat', e: '🛋️' }, { w: 'mat', e: '🧶' }];

                  <div class="h-16 w-16 flex items-center justify-center">

          <div class="p-5 bg-[#F9F6FF] border border-[#E9D8FD] rounded-2xl my-3">

                const clean = w.replace(/[^A-Za-z]/g, '').toLowerCase();

    let step4Attempts = 0;

    const STT_URL = '/kidobits/stt';
    const MIN_SPEECH_MS = 200;
    const VOICE_LO_HZ = 200;
    const SPEECH_RMS = 0.030;
    const REC_WINDOW_MS = 5000;
    const SILENCE_HOLD_MS = 600;
    const NO_SPEECH_MS = 4500;

    let micStream = null;
    let micAttemptId = 0;
    let isMicRecording = false;

    async function ensureMic() {
      if (micStream && micStream.active) return micStream;
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      return micStream;
    }

    function pickMime() {
      if (typeof MediaRecorder === 'undefined') return '';
      const c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
      for (const x of c) { try { if (MediaRecorder.isTypeSupported(x)) return x; } catch (e) {} }
      return '';
    }

    async function listenOnce(targetWord, onState) {
      const myId = ++micAttemptId;
      const stub = { text: '', raw: '', fuzzy_ok: false, via: 'error', decision: 'error' };

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        onState && onState('nomedia', 'เบราว์เซอร์ไม่รองรับไมค์ 😢');
        return stub;
      }
      let stream;
      try {
        stream = await ensureMic();
      } catch (e) {
        onState && onState('noperm', 'กรุณาอนุญาตไมค์ 🎙️');
        return stub;
      }

      return await new Promise((resolve) => {
        const chunks = [];
        let speechDetected = false, lastVoiceTs = 0, voicedMs = 0, recStart = Date.now();
        let mime = pickMime();
        let rec;
        try {
          rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        } catch (e) {
          onState && onState('nocorder', 'อัดเสียงไม่ได้');
          return resolve(stub);
        }

        let vuCtx = null, analyser = null, rafId = null, ceiling = null;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) {
            vuCtx = new Ctx();
            const src = vuCtx.createMediaStreamSource(stream);
            analyser = vuCtx.createAnalyser();
            analyser.fftSize = 256;
            src.connect(analyser);
          }
        } catch (e) {}

        const cleanup = () => {
          isMicRecording = false;
          try { if (rafId) cancelAnimationFrame(rafId); } catch (e) {}
          try { if (ceiling) clearTimeout(ceiling); } catch (e) {}
          try { if (vuCtx) vuCtx.close(); } catch (e) {}
        };

        const stop = () => {
          try { if (rec && rec.state !== 'inactive') rec.stop(); } catch (e) {}
        };

        rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
        rec.onerror = () => { cleanup(); resolve(stub); };
        rec.onstop = async () => {
          cleanup();
          const blob = new Blob(chunks, { type: mime || 'audio/webm' });
          if (blob.size < 1200 || !speechDetected || voicedMs < MIN_SPEECH_MS) {
            onState && onState('tooshort', 'ไม่ได้ยินเสียงชัด — ลองอีกครั้งนะ 🙂');
            return resolve(stub);
          }
          onState && onState('thinking', 'กำลังตรวจเสียง… 🎧');
          const fd = new FormData();
          fd.append('audio', blob, 'child.webm');
          const tw = String(targetWord || '').toLowerCase();
          const sentWords = tw.replace(/[^a-z ]/g, ' ').split(/\s+/).filter(Boolean);
          const hint = (sentWords.length > 1 ? sentWords : [tw]).filter(Boolean);
          fd.append('hint', Array.from(new Set(hint)).join(','));
          const ctrl = new AbortController();
          const to = setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, 30000);
          try {
            const resp = await fetch(STT_URL, { method: 'POST', body: fd, signal: ctrl.signal });
            clearTimeout(to);
            if (myId !== micAttemptId) return resolve(stub);
            const data = await resp.json();
            const raw = (data && data.text) || '';
            const clean = raw.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, ' ').replace(/\s+/g, ' ').trim();
            resolve({
              text: clean,
              raw: raw,
              fuzzy_ok: !!(data && data.fuzzy_ok),
              via: (data && data.via) || 'asr',
              decision: (data && data.decision) || 'asr',
              spelled: !!(data && data.spelled),
              elapsed: data && data.elapsed,
            });
          } catch (e) {
            clearTimeout(to);
            resolve(stub);
          }
        };

        try {
          rec.start();
          isMicRecording = true;
        } catch (e) {
          cleanup();
          onState && onState('nocorder', 'อัดเสียงไม่ได้');
          return resolve(stub);
        }
        onState && onState('recording', '🎙️ กำลังฟัง… พูดเลยจ้ะ');

        const poll = () => {
          if (myId !== micAttemptId) return stop();
          const dur = Date.now() - recStart;
          if (analyser) {
            try {
              const freq = new Uint8Array(analyser.frequencyBinCount);
              analyser.getByteFrequencyData(freq);
              const hzPerBin = (vuCtx.sampleRate || 48000) / 2 / freq.length;
              const lo = Math.max(1, Math.floor(VOICE_LO_HZ / hzPerBin));
              const hi = Math.min(freq.length - 1, Math.ceil(3500 / hzPerBin));
              let sum = 0, n = 0;
              for (let i = lo; i <= hi; i++) { sum += freq[i] * freq[i]; n++; }
              const bandRms = n ? Math.sqrt(sum / n) / 255 : 0;
              if (bandRms > SPEECH_RMS) { speechDetected = true; lastVoiceTs = Date.now(); voicedMs += 16; }
            } catch (e) {}
          }
          if (dur >= REC_WINDOW_MS) return stop();
          if (speechDetected) {
            if (Date.now() - lastVoiceTs >= SILENCE_HOLD_MS) return stop();
          } else if (dur >= NO_SPEECH_MS) { return stop(); }
          if (speechDetected && voicedMs < MIN_SPEECH_MS) speechDetected = false;
          rafId = requestAnimationFrame(poll);
        };
        rafId = requestAnimationFrame(poll);
        ceiling = setTimeout(stop, REC_WINDOW_MS + 500);
      });
    }

    const SENT_FUNC_WORDS = new Set(['the', 'a', 'an', 'is', 'in', 'on', 'at', 'by', 'to', 'it', 'and', 'was', 'were', 'of', 'with', 'his', 'her', 'he', 'she', 'they', 'we', 'you', 'said', 'can', 'us', 'be', 'for', 'that', 'this']);
    function sentWordsOf(txt) {
      return String(txt || '').toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(Boolean);
    }
    function scoreSentence(target, heard) {
      const tw = sentWordsOf(target).filter(w => !SENT_FUNC_WORDS.has(w));
      const hw = sentWordsOf(heard);
      if (!tw.length) return { ratio: 0, hit: [], miss: [] };
      const pool = hw.slice();
      const hit = [], miss = [];
      for (const w of tw) {
        let idx = pool.indexOf(w);
        if (idx === -1) {
          const aliases = WORD_ALIASES[w] || [];
          idx = pool.findIndex(x => aliases.includes(x));
        }
        if (idx === -1) {
          idx = pool.findIndex(x => x.length > 3 && w.length > 3 && x[0] === w[0] && x.slice(0, 3) === w.slice(0, 3));
        }
        if (idx > -1) { hit.push(w); pool.splice(idx, 1); }
        else miss.push(w);
      }
      return { ratio: hit.length / Math.max(1, tw.length), hit, miss };
    }

    function playWordSound(w) {
      const clean = w.replace(/[^A-Za-z]/g, '').toLowerCase();
      if (!clean || clean === 'a') {
        playSentenceAudio();
      } else {
        playAudio(`word_${clean}.mp3`, `🔊 ${clean}`);
      }
    }

    function playSentenceAudio() {
      if (!currentItem || currentItem.step !== 5) return;
      unlockAudio();
      const lidClean = String(LID || "").toLowerCase().replace(".", "_");
      const sentAudio = currentItem.sentence_audio || `/kidobits/v2/audio/sent_${lidClean}.mp3`;
      playAudio(sentAudio, `🔊 ${currentItem.sentence || currentItem.word}`, () => {}, (err) => {
        // Fallback: play words sequentially using word audios
        if (currentItem && currentItem.words && currentItem.words.length) {
          const wordList = currentItem.words.map(w => w.toLowerCase().replace(/[^a-z]/g, '')).filter(Boolean);
          let wIdx = 0;
          function playNextWord() {
            if (wIdx < wordList.length) {
              const curW = wordList[wIdx++];
              playAudio(`/kidobits/v2/audio/word_${curW}.mp3`, `🔊 ${curW}`, playNextWord, playNextWord);
            }
          }
          playNextWord();
        }
      });
    }

    async function startMicStep4() {
      if (!currentItem || currentItem.step !== 4) return;
      const target = String(currentItem.word || '').toLowerCase().trim();
      const statusBox = document.getElementById('mic-status-box-4');
      const micBtn = document.getElementById('btn-mic-step4');
      if (micBtn) micBtn.classList.add('animate-pulse', 'ring-4', 'ring-[#8B7CFF]');

      const res = await listenOnce(target, (state, msg) => {
        if (statusBox) {
          if (state === 'recording') {
            statusBox.innerHTML = `<span class="text-[#D81B60] font-bold animate-pulse">🎙️ กำลังฟัง... พูดคำว่า "${target}" เลยจ้ะ</span>`;
          } else if (state === 'thinking') {
            statusBox.innerHTML = `<span class="text-[#8B7CFF] font-bold">🎧 กำลังตรวจเสียงอ่าน...</span>`;
          } else {
            statusBox.innerHTML = `<span class="text-[#7B7488] font-bold">${msg || ''}</span>`;
          }
        }
      });

      if (micBtn) micBtn.classList.remove('animate-pulse', 'ring-4', 'ring-[#8B7CFF]');
      const heard = (res.text || '').trim();
      const heardTokens = heard.split(/\s+/).filter(Boolean);
      const aliases = WORD_ALIASES[target] || [];
      const isAliasMatch = aliases.some(a => heard === a || heardTokens.includes(a) || heard.includes(a));
      const isHit = (heard === target) || res.fuzzy_ok || (heard.includes(target)) || heardTokens.includes(target) || isAliasMatch;

      if (isHit) {
        step4Attempts = 0;
        if (statusBox) statusBox.innerHTML = `<span class="text-[#1B9A62] font-extrabold">✅ ยอดเยี่ยมมาก! อ่านถูกต้อง 🎉</span>`;
        submitAnswer(target, { fuzzy_ok: true });
      } else if (!heard) {
        if (statusBox) statusBox.innerHTML = `<span class="text-[#E67E22] font-bold">ไม่ได้ยินเสียงชัด — กดปุ่ม 🎙️ แล้วลองพูดอีกครั้งนะ 🙂</span>`;
      } else {
        step4Attempts = (step4Attempts || 0) + 1;
        let hintMsg = '';
        if (step4Attempts >= 2) {
          hintMsg = `<br/><span class="text-xs text-[#8B7CFF] font-bold mt-1 inline-block animate-pulse">💡 หากติดขัด สามารถแตะปุ่ม "ข้ามข้อนี้ / อ่านได้แล้ว ✔" ด้านล่างได้เลยนะ</span>`;
          const skipBtn = document.getElementById('btn-skip-step4');
          if (skipBtn) {
            skipBtn.classList.remove('text-[#8E869E]');
            skipBtn.classList.add('bg-[#8B7CFF]', 'text-white', 'px-4', 'py-1.5', 'rounded-full', 'shadow', 'font-extrabold');
          }
        }
        if (statusBox) statusBox.innerHTML = `<span class="text-[#E74C3C] font-bold">ได้ยินว่า "${heard}" — กดปุ่ม 🎙️ แล้วลองใหม่อีกทีนะ 🙂</span>${hintMsg}`;
        playAudio('/kidobits/v2/audio/try_again.mp3', 'ลองอีกครั้ง');
      }
    }

    async function startMicStep5() {
      if (!currentItem || currentItem.step !== 5) return;
      const sentence = currentItem.sentence || currentItem.word || '';
      const statusBox = document.getElementById('mic-status-box-5');
      const micBtn = document.getElementById('btn-mic-step5');
      if (micBtn) micBtn.classList.add('animate-pulse', 'ring-4', 'ring-[#1B9A62]');

      const res = await listenOnce(sentence, (state, msg) => {
        if (statusBox) {
          if (state === 'recording') {
            statusBox.innerHTML = `<span class="text-[#D81B60] font-bold animate-pulse">🎙️ กำลังฟัง... อ่านประโยคเลยจ้ะ</span>`;
          } else if (state === 'thinking') {
            statusBox.innerHTML = `<span class="text-[#8B7CFF] font-bold">🎧 กำลังตรวจเสียงอ่าน...</span>`;
          } else {
            statusBox.innerHTML = `<span class="text-[#7B7488] font-bold">${msg || ''}</span>`;
          }
        }
      });

      if (micBtn) micBtn.classList.remove('animate-pulse', 'ring-4', 'ring-[#1B9A62]');
      const heard = (res.text || '').trim();
      const sc = scoreSentence(sentence, heard);
      const isHit = (sc.ratio >= 0.4) || (heard.toLowerCase() === sentence.toLowerCase()) || res.fuzzy_ok;

      if (isHit) {
        if (statusBox) statusBox.innerHTML = `<span class="text-[#1B9A62] font-extrabold">✅ หนูอ่านได้ ${sc.hit.length} จาก ${sc.hit.length + sc.miss.length} คำ — เก่งมาก! 🎉</span>`;
        submitAnswer(sentence, { fuzzy_ok: true });
      } else if (!heard) {
        if (statusBox) statusBox.innerHTML = `<span class="text-[#E67E22] font-bold">ไม่ได้ยินเสียงชัด — กดปุ่ม 🎙️ แล้วลองอ่านอีกครั้งนะ 🙂</span>`;
      } else {
        const missTxt = sc.miss.length ? (` (ลองคำ: ${sc.miss.join(', ')})`) : '';
        if (statusBox) statusBox.innerHTML = `<span class="text-[#E74C3C] font-bold">ได้ยินว่า "${heard}" — ลองอีกครั้งนะ 🙂${missTxt}</span>`;
        playAudio('/kidobits/v2/audio/try_again.mp3', 'ลองอีกครั้ง');
      }
    }

  </script>
