document.getElementById('hero').style.background = m[2];
document.getElementById('cnt').textContent = ids.length + ' บท';

document.getElementById('grid').innerHTML = ids.map(function(id){
  var v = LESSONS[id];
  var tl = (v.read && v.read.length) ? v.read.map(function(x){return x.word}).join(' · ') : v.targets;
  return '<div class="card" onclick="openLesson(\'' + id + '\')">' +
    '<div class="num">' + String(v.n).padStart(2, '0') + '</div>' +
    '<div style="flex:1"><div class="ttl">' + v.title + '</div>' +
    '<div class="goal">' + v.goal + '</div>' +
    '<div class="tg">' + tl + '</div></div></div>';
}).join('');

function openLesson(id){ location.href = '/theme/theme_phonicsLearn.html?id=' + id; }
function goBack(){ location.href = '/theme/theme_phonicsLevel.html'; }
</script>
</body></html>
