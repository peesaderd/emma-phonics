  <script>

            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-1 mb-0.5">
                <div class="flex items-center gap-1.5">
                  <span class="px-2 py-0.5 rounded-md bg-orange-50 text-[10px] font-black text-orange-600 border border-orange-100">${les.id}</span>
                  <span class="text-[10px] font-bold text-slate-400">ระดับ ${les.difficulty || 1}</span>
                </div>
                <div class="flex items-center gap-0.5">${starsHtml}</div>
              </div>
              <h3 class="font-fredoka text-sm font-bold text-slate-800 truncate">${les.title}</h3>
              <p class="text-[11px] text-slate-400 truncate">${les.theme || ''}</p>
            </div>
          </div>
          <!-- 4 Mini-games tags in lesson -->
          <div class="flex items-center gap-1 flex-wrap pt-2 border-t border-slate-50">
            ${stagesHtml}
          </div>
        `;

        container.appendChild(card);
      });

      const starsChip = document.getElementById('starsChip');
      if (starsChip && totalStars > 0) {
        starsChip.textContent = totalStars;
      }

      // Update Curriculum Lock Status Bar
      if (window.KidobitsLock) {
        const isBypassed = KidobitsLock.isBypass();
        const maxUn = KidobitsLock.getUnlockedMax('math');
        const progText = document.getElementById('mathProgText');
        const bypassBtn = document.getElementById('bypassNoticeBtn');
        if (isBypassed) {
          if (progText) progText.textContent = 'โหมดครูเปิดอยู่ (ปลดล็อคทุกบท)';
          if (bypassBtn) bypassBtn.classList.remove('hidden');
        } else {
          if (progText) {
            progText.textContent = maxUn >= 12 ? 'จบครบ 12 บทแล้ว 🏆 (เล่นซ้ำได้)' : `ปลดล็อคบทที่ 1-${maxUn} · บทที่ ${maxUn + 1}-12 ล็อคอยู่`;
          }
          if (bypassBtn) bypassBtn.classList.add('hidden');
        }
      }
    }

    function filterLessons(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => {
        b.className = 'filter-tab flex-1 py-1.5 rounded-xl text-slate-500 hover:bg-slate-50 text-center transition';
      });

      const activeBtn = filter === 'all' ? document.getElementById('tabAll')
        : filter === 'lv1' ? document.getElementById('tabLv1')
        : filter === 'lv2' ? document.getElementById('tabLv2')
        : document.getElementById('tabLv3');

      if (activeBtn) {
        activeBtn.className = 'filter-tab flex-1 py-1.5 rounded-xl bg-orange-500 text-white font-black text-center shadow-xs transition';
      }

      renderLessons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderLessons();
    });

    function checkMathResume() {
      if (!window.KidobitsResume) return;
      KidobitsResume.renderBanner({
        storageKey: 'kidobits_math_progress',
        containerId: 'mathResumeBannerContainer',
        theme: 'orange',
        onResume: function(act) {
          const num = parseInt((act.lessonId || '').replace(/[^0-9]/g, ''), 10) || 1;
          const stg = act.step || 0;
          window.location.href = `/math.html?lesson=${num}&stage=${stg}`;
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkMathResume();
    });

  </script>
  <script src="/theme/js/kidobits_dynamic_island.js"></script>
</body>
</html>
