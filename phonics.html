var AZ = [{"letter": "A", "word": "Apple", "emoji": "🍎", "thai": "แอะ"}, {"letter": "B", "word": "Ball", "emoji": "⚽", "thai": "เบอะ"}, {"letter": "C", "word": "Cat", "emoji": "🐱", "thai": "เคอะ"}, {"letter": "D", "word": "Dog", "emoji": "🐶", "thai": "เดอะ"}, {"letter": "E", "word": "Elephant", "emoji": "🐘", "thai": "เอะ"}, {"letter": "F", "word": "Fish", "emoji": "🐟", "thai": "เฟอะ"}, {"letter": "G", "word": "Grapes", "emoji": "🍇", "thai": "เกอะ"}, {"letter": "H", "word": "House", "emoji": "🏠", "thai": "เฮอะ"}, {"letter": "I", "word": "Ice Cream", "emoji": "🍦", "thai": "อิ"}, {"letter": "J", "word": "Juice", "emoji": "🧃", "thai": "เจอะ"}, {"letter": "K", "word": "Kite", "emoji": "🪁", "thai": "เคอะ"}, {"letter": "L", "word": "Lion", "emoji": "🦁", "thai": "เลอะ"}, {"letter": "M", "word": "Moon", "emoji": "🌙", "thai": "เมอะ"}, {"letter": "N", "word": "Nest", "emoji": "🪹", "thai": "เนอะ"}, {"letter": "O", "word": "Orange", "emoji": "🍊", "thai": "ออ"}, {"letter": "P", "word": "Penguin", "emoji": "🐧", "thai": "เพอะ"}, {"letter": "Q", "word": "Queen", "emoji": "👑", "thai": "ควอ"}, {"letter": "R", "word": "Rainbow", "emoji": "🌈", "thai": "เรอะ"}, {"letter": "S", "word": "Sun", "emoji": "☀️", "thai": "เซอะ"}, {"letter": "T", "word": "Tiger", "emoji": "🐯", "thai": "เทอะ"}, {"letter": "U", "word": "Umbrella", "emoji": "☂️", "thai": "อะ"}, {"letter": "V", "word": "Violin", "emoji": "🎻", "thai": "เวอะ"}, {"letter": "W", "word": "Whale", "emoji": "🐳", "thai": "เวอะ"}, {"letter": "X", "word": "Xylophone", "emoji": "🎵", "thai": "เอ็กซ์"}, {"letter": "Y", "word": "Yo-yo", "emoji": "🪀", "thai": "เยอะ"}, {"letter": "Z", "word": "Zebra", "emoji": "🦓", "thai": "ซี"}];
var T = {"back": "\u2190 \u0e1a\u0e17\u0e40\u0e23\u0e35\u0e22\u0e19", "fire": "\uD83D\uDD25 5", "star": "\u2b50 0", "gem": "\ud83d\udc8e 0", "teach": "\u0e2a\u0e2d\u0e19\u0e19\u0e33", "listen": "\u0e1f\u0e31\u0e07\u0e40\u0e2a\u0e35\u0e22\u0e07", "badge": "\u0e04\u0e23\u0e39\u0e01\u0e33\u0e25\u0e31\u0e07\u0e1e\u0e39\u0e14\u0e19\u0e33 \ud83d\udd0a", "lead": "\u0e04\u0e23\u0e39\u0e40\u0e2d\u0e47\u0e21\u0e21\u0e48\u0e32\u0e2a\u0e2d\u0e19\u0e19\u0e33: ", "vu": "\u0e23\u0e30\u0e14\u0e31\u0e1a\u0e40\u0e2a\u0e35\u0e22\u0e07\u0e44\u0e21\u0e04\u0e4c: ", "play": "\ud83d\udd0a \u0e1f\u0e31\u0e07\u0e40\u0e2a\u0e35\u0e22\u0e07", "mic": "\ud83c\udf99\ufe0f", "heard": "\u0e1f\u0e31\u0e07: ", "dot": "\u2022"};
var idx = 0, spoken = '';

function el(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function txt(tag, cls, text){
  var e = el(tag, cls);
  e.textContent = text;
  return e;
}

function render(){
  var cur = AZ[idx];
  var root = document.getElementById('root');
  root.innerHTML = '';

  var wrap = el('div','min-h-screen bg-[#FFF7FB]');
  var box  = el('div','max-w-md mx-auto px-5 pt-5 pb-10');

  top.appendChild(txt('span','bg-white border rounded-full px-2.5 py-1.5 text-xs font-extrabold', T.star));
  top.appendChild(txt('span','bg-white border rounded-full px-2.5 py-1.5 text-xs font-extrabold', T.gem));
  var live = el('span','bg-[#E8FFF0] border rounded-full px-2.5 py-1.5 text-xs font-extrabold flex items-center gap-1');
  live.appendChild(el('i','w-2 h-2 bg-[#1B9A62] rounded-full'));
  live.appendChild(document.createTextNode(' LIVE'));
  top.appendChild(live);
  box.appendChild(top);

  var tabs = el('div','flex gap-2 mt-3');
  var t1 = txt('button','bg-[#8B7CFF] text-white px-3 py-2 rounded-full text-xs font-extrabold', T.teach);
  var t2 = txt('button','bg-white border px-3 py-2 rounded-full text-xs font-extrabold', T.listen);
  t1.onclick = speak; t2.onclick = speak;
  tabs.appendChild(t1); tabs.appendChild(t2);
  box.appendChild(tabs);

  var card = el('div','bg-white border-2 border-[#F1EAF7] rounded-[24px] p-4 mt-3 text-center relative');

  var hero = el('div','bg-[#FFF8E0] rounded-[20px] py-6 relative');

  var strip = el('div','inline-flex items-center gap-2 bg-[#FFF8E0] rounded-full px-4 py-2 mt-3 font-extrabold text-lg');

  strip.appendChild(txt('span',null,T.dot));

  var tb = el('div','bg-[#F0EFFF] rounded-[20px] p-3 mt-3');
  tb.appendChild(txt('p','font-extrabold text-sm', T.lead + cur.letter + ' \u2026 ' + cur.thai + ' \u2026 ' + cur.word));

  var track = el('div','h-3 bg-white rounded-full overflow-hidden mt-1');
  var bar = el('div','h-full bg-[#FF5B6A] rounded-full transition-all');

  tb.appendChild(track);

  prev.disabled = (idx === 0);
  if (idx === 0) prev.classList.add('opacity-40');
  prev.onclick = function(){ if (idx > 0) { idx--; render(); speak(); } };
  var lis = txt('button','flex-1 bg-[#FFC93C] py-3 rounded-full font-extrabold', T.play);
  lis.onclick = speak;
  var next = txt('button','flex-1 bg-black text-white py-3 rounded-full font-extrabold', 'Next \u2192');
  next.disabled = (idx === 25);
  if (idx === 25) next.classList.add('opacity-40');
  next.onclick = function(){ if (idx < 25) { idx++; render(); speak(); } };
  nav.appendChild(prev); nav.appendChild(lis); nav.appendChild(next);

  var msg = txt('p','text-center font-bold mt-2 text-sm', spoken);
  card.appendChild(msg);

  var chips = el('div','flex gap-1 flex-wrap justify-center mt-3');
  AZ.forEach(function(v, y){

  wrap.appendChild(box);
  root.appendChild(wrap);

function speak(){
  var cur = AZ[idx];
  spoken = T.heard + cur.letter + ' \u2014 ' + cur.word + ' ' + String.fromCodePoint(0x1F50A);
  var m = document.querySelector('p.text-center.font-bold.mt-2');
  if (m) m.textContent = spoken;
  if (audioEl) { try { audioEl.pause(); } catch(e){} }
  audioEl = new Audio('/kidobits/audio/' + cur.letter + '.mp3?v=6');
  audioEl.onerror = function(){ tts(cur); };
  audioEl.play().catch(function(){ tts(cur); });
}

function tts(cur){
  try{
    if (!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(cur.letter + '. ' + cur.word);
    u.lang = 'en-US'; u.rate = 0.75;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

render();
