<!DOCTYPE html>
<html lang="th" class="min-h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFFDF9">
  <title>Kidobits Story Time · นิทานเสียงภาพประกอบ 📚✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600;700;800;900&family=Prompt:wght@500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Plus Jakarta Sans', 'Prompt', 'Noto Sans Thai', 'sans-serif'],
            thai: ['Noto Sans Thai', 'Prompt', 'sans-serif'],
            story: ['Baloo 2', 'Noto Sans Thai', 'sans-serif']
          },
          colors: {
            storybook: {
              50: '#FDF8F0',
              100: '#F8EED9',
              200: '#EEDBB5',
              500: '#D97706',
              600: '#B45309',
              800: '#78350F'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100%;
      font-family: 'Noto Sans Thai', 'Plus Jakarta Sans', sans-serif;
      overscroll-behavior-y: auto;
      background-color: #FAF7F2;
    }
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    nav.fixed[class*="bottom-"] {
      bottom: max(12px, calc(10px + env(safe-area-inset-bottom, 0px))) !important;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Micro-Animations & Ken Burns for Story Scenes */
    @keyframes kenBurnsSlow {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.06) translate(-1%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }
    .anim-kenburns {
      animation: kenBurnsSlow 16s ease-in-out infinite alternate;
    }

    @keyframes sparkleGlow {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #FBBF24); }
    }
    .anim-sparkle {
      animation: sparkleGlow 2.5s ease-in-out infinite;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4); }
      70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(217, 119, 6, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); }
    }
    .anim-play-pulse {
      animation: pulseRing 2s infinite;
    }

    /* Paragraph Active Highlight */
    .para-box {
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .para-active {
      background: linear-gradient(135deg, #FFFDF8 0%, #FEF3C7 100%) !important;
      border-color: #F59E0B !important;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.22) !important;
      transform: scale(1.015);
    }

    /* Sound wave indicator bars */
    .sound-bar {
      display: inline-block;
      width: 3px;
      background-color: #D97706;
      border-radius: 9999px;
      animation: waveBar 1.2s ease-in-out infinite;
    }
    @keyframes waveBar {
      0%, 100% { height: 6px; }
      50% { height: 18px; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 select-none pb-28 overscroll-y-auto">

  <!-- 1. STANDARD KIDOBITS TOP BAR -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-amber-100 shadow-xs">
    <div class="max-w-4xl mx-auto px-3 py-2 flex items-center justify-between gap-2">
      <!-- Back button -->
      <button onclick="if (history.length > 1) { history.back(); } else { location.href='/theme/theme_home.html'; }" class="btn-press flex items-center gap-1 px-3 py-1.5 rounded-full bg-white shadow-xs border border-slate-200 text-xs font-bold text-slate-700 hover:bg-slate-50 transition active:scale-95" title="ย้อนกลับ">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        <span>กลับ</span>
      </button>

      <!-- Center Title -->
      <div class="flex items-center gap-1.5">
        <span class="text-xl">📚</span>
        <div>
          <span class="text-xs sm:text-sm font-black text-slate-900 tracking-tight">Kidobits Story Time</span>
          <span class="hidden sm:inline-block px-2 py-0.2 rounded-full bg-amber-100 text-amber-800 text-[10px] font-bold ml-1">นิทานภาพมีเสียง</span>
        </div>
      </div>

      <!-- Stats Chips -->
      <div class="flex items-center gap-1.5">
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-red-50 border border-red-100 text-[11px] font-black text-red-600 shadow-2xs">
          <span>🔥</span>
          <span id="streakChip">7</span>
        </div>
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-50 border border-amber-100 text-[11px] font-black text-amber-600 shadow-2xs">
          <span>⭐</span>
          <span id="starsChip">0</span>
        </div>
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-100 text-[11px] font-black text-emerald-600 shadow-2xs">
          <span>🪙</span>
          <span id="userCoins">240</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 2. MAIN STORYBOOK WRAPPER -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-3 flex flex-col justify-start">

    <!-- Story Selector Horizontal Carousel -->
    <div class="w-full mb-3">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="storyTabs">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- 3. ANIMATED STORY SCENE STAGE (Picture Storybook Screen) -->
    <div class="relative w-full h-64 sm:h-72 rounded-3xl overflow-hidden shadow-xl border-2 border-amber-200/90 mb-3 select-none flex items-center justify-center bg-slate-900 group" id="storyStageBox">
      
      <!-- High-Resolution Storybook Illustration Image -->
      <img id="sceneHeroImg" src="/assets/stories/magic_library_1.jpg" alt="Story Scene" class="absolute inset-0 w-full h-full object-cover object-center transition-all duration-500 ease-out transform" />

      <!-- Gentle Dark Vignette Overlay for Crisp Typography -->
      <div id="sceneGlowOverlay" class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-black/30 pointer-events-none"></div>

      <!-- Sparkles and Ambient Bedtime Atmosphere -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <span class="anim-sparkle absolute top-4 left-6 text-yellow-300 text-lg">✨</span>
        <span class="anim-sparkle absolute top-8 right-12 text-yellow-200 text-sm" style="animation-delay: 1.2s;">⭐</span>
        <span class="anim-sparkle absolute bottom-16 left-8 text-yellow-300 text-xs" style="animation-delay: 0.6s;">✨</span>
        <span class="anim-sparkle absolute bottom-20 right-14 text-yellow-200 text-base" style="animation-delay: 1.8s;">⭐</span>
      </div>

      <!-- Story Bedtime Moon Tag in corner -->
      <div class="absolute top-3 left-3 flex items-center gap-1.5 px-3 py-1 rounded-full bg-black/45 backdrop-blur-md border border-white/25 text-[11px] font-bold text-white shadow-xs">
        <span>🌙</span>
        <span>นิทานภาพก่อนนอน</span>
      </div>

      <!-- Lullaby BGM Toggle -->
      <button onclick="toggleBgmMusic()" id="btnBgmToggle" class="absolute top-3 right-3 px-3 py-1 rounded-full bg-black/45 hover:bg-black/60 backdrop-blur-md border border-white/25 text-[11px] font-black text-white shadow-xs transition active:scale-95 flex items-center gap-1.5" title="เปิด/ปิด ดนตรีบรรเลงกล่อมนอน">
        <span id="bgmIcon">🎵</span>
        <span id="bgmLabel">ดนตรี: เปิด</span>
      </button>

      <!-- Bottom Caption Bar on Image -->
      <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between text-white z-10 pointer-events-none">
        <div class="bg-black/50 backdrop-blur-md px-3.5 py-1.5 rounded-2xl border border-white/20 flex items-center gap-2">
          <span id="sceneBadgeIcon" class="text-base">✨</span>
          <div>
            <h2 id="sceneStoryTitle" class="text-xs sm:text-sm font-black text-white tracking-wide leading-tight">The Magic Library</h2>
            <p id="sceneStorySubtitle" class="text-[10px] text-amber-200 font-medium font-thai">ห้องสมุดมหัศจรรย์</p>
          </div>
        </div>

        <div class="bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-2xl border border-white/20 flex items-center gap-1.5 text-[11px] font-black text-amber-300">
          <span id="scenePageBadge">ฉากที่ 1/3</span>
        </div>
      </div>

    </div>

    <!-- 4. AUDIO CONTROL CONSOLE BAR -->
    <div class="w-full bg-white rounded-2xl border border-amber-200/90 p-2.5 sm:p-3 mb-3 shadow-xs flex items-center justify-between gap-2 flex-wrap">
      
      <!-- Primary Playback Controls -->
      <div class="flex items-center gap-2">
        <button id="btnMainPlay" onclick="togglePlayNarration()" class="w-11 h-11 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white flex items-center justify-center text-lg shadow-md shadow-orange-500/25 transition active:scale-95 anim-play-pulse" title="เล่น/หยุดเสียงเล่า">
          <i id="mainPlayIcon" class="fa-solid fa-play ml-0.5"></i>
        </button>
        <button onclick="restartStoryAudio()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-xs transition active:scale-95 border border-slate-200" title="เริ่มเล่าใหม่ตั้งแต่ต้น">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        
        <!-- Live Audio Wave Indicator -->
        <div id="audioWaveBox" class="hidden flex items-center gap-0.5 px-2 py-1 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-[10px] font-black">
          <span class="sound-bar" style="animation-delay: 0.1s;"></span>
          <span class="sound-bar" style="animation-delay: 0.3s;"></span>
          <span class="sound-bar" style="animation-delay: 0.2s;"></span>
          <span class="ml-1">กำลังเล่า</span>
        </div>
      </div>

      <!-- Language & Speech Rate Switcher -->
      <div class="flex items-center gap-1.5">
        <!-- Dual Language Toggle -->
        <div class="flex items-center p-0.5 bg-slate-100 rounded-xl border border-slate-200 text-xs font-bold">
          <button onclick="setNarrationLang('en')" id="btnLangEn" class="px-2.5 py-1 rounded-lg font-black transition active:scale-95 bg-white text-amber-700 shadow-xs">
            🇬🇧 EN
          </button>
          <button onclick="setNarrationLang('th')" id="btnLangTh" class="px-2.5 py-1 rounded-lg text-slate-600 transition active:scale-95">
            🇹🇭 TH
          </button>
        </div>

        <!-- Speed rate -->
        <button onclick="toggleSpeechRate()" id="btnRateToggle" class="px-2.5 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-black border border-slate-200 transition active:scale-95">
          <span id="rateLabel">0.85x</span>
        </button>
      </div>

    </div>

    <!-- 5. INTERACTIVE STORY PARAGRAPHS (READ-ALONG WITH SCENE THUMBNAILS) -->
    <div class="space-y-3" id="storyParagraphsContainer">
      <!-- Paragraph cards rendered dynamically by JS -->
    </div>

    <!-- 6. NEXT STORY & REWARDS BUTTONS -->
    <div class="mt-5 flex items-center gap-2">
      <button onclick="finishStoryReward()" class="flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-black text-sm shadow-md shadow-amber-500/25 transition active:scale-95 flex items-center justify-center gap-2">
        <span>🏆 จบเรื่องแล้วรับรางวัล (+5 ⭐)</span>
      </button>
      <button onclick="nextStory()" class="py-3 px-4 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold text-xs transition active:scale-95 flex items-center gap-1.5">
        <span>เรื่องถัดไป</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </div>

  </main>

  <!-- 7. VICTORY CELEBRATION MODAL -->
  <div id="storyWinModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl border-4 border-amber-300 animate-pop">
      <div class="text-5xl animate-bounce">🌟</div>
      <div>
        <h3 class="text-xl font-black text-slate-900 font-display">เก่งมากจ้า! จบนิทานแล้ว</h3>
        <p class="text-xs text-slate-500 font-bold mt-1">น้องฟังและอ่านนิทานจนจบ ได้รับดาวสะสมเพิ่ม!</p>
      </div>

      <div class="flex items-center justify-center gap-4 py-3 bg-amber-50 rounded-2xl border border-amber-200">
        <div class="flex items-center gap-1.5 text-base font-black text-amber-700">
          <span>⭐</span>
          <span>+5 ดาว</span>
        </div>
        <div class="flex items-center gap-1.5 text-base font-black text-emerald-700">
          <span>🪙</span>
          <span>+25 เหรียญ</span>
        </div>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <button onclick="closeWinModal(); restartStoryAudio();" class="flex-1 py-2.5 px-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs transition active:scale-95">
          🔄 ฟังอีกครั้ง
        </button>
        <button onclick="closeWinModal(); nextStory();" class="flex-1 py-2.5 px-3 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black text-xs shadow-md shadow-amber-500/20 transition active:scale-95">
          เรื่องถัดไป ➔
        </button>
      </div>
    </div>
  </div>

  <nav class="fixed bottom-3 left-3 right-3 max-w-[430px] mx-auto bg-white shadow-[0_10px_30px_rgba(60,30,90,.18)] rounded-full px-2 py-2 flex justify-between border border-[#F3EDF8] z-50" aria-label="Main navigation">

    <button onclick="window.location.href='/theme/theme_phonics_map.html'" class="flex flex-col items-center gap-0.5 min-w-[52px]" aria-label="Phonics">

  <script src="/js/kidobits_wallet.js"></script>

  <!-- STORY ENGINE & AUDIO SCRIPT -->
  <script>
    // 1. CURATED STORY REPOSITORY WITH SCENE ILLUSTRATIONS (3 STORIES X 3 SCENES)
    const STORIES_DATA = [
      {
        id: 'magic_library',
        title: 'The Magic Library',
        thTitle: 'ห้องสมุดมหัศจรรย์',
        mins: '3 นาที',
        badge: '✨',
        emojis: ['📖', '🦁', '🚀'],
        paragraphs: [

    // 2. STATE MANAGEMENT
    let currentStoryIdx = 0;
    let narrationLang = 'en'; // 'en' or 'th'
    let speechRate = 0.85; // 0.85x, 1.0x, 1.2x
    let isPlaying = false;
    let currentParaIdx = -1;
    let bgmEnabled = true;
    let userStars = parseInt(localStorage.getItem('KB_STARS') || '0', 10);

    // 3. SYNTHETIC LULLABY MUSIC ENGINE (SOFT MUSIC BOX)
    let musicAudioCtx = null;
    let bgmInterval = null;

    function initBgmEngine() {
      if (!musicAudioCtx && (window.AudioContext || window.webkitAudioContext)) {
        musicAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (musicAudioCtx && musicAudioCtx.state === 'suspended') {
        musicAudioCtx.resume();
      }
    }

    // Gentle lullaby chime notes (Pentatonic soft bells: C4, D4, E4, G4, A4, C5)
    const LULLABY_NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 392.00, 329.63];
    let noteStep = 0;

    function playSoftChime() {
      if (!bgmEnabled || !musicAudioCtx) return;
      try {
        const osc = musicAudioCtx.createOscillator();
        const gain = musicAudioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(LULLABY_NOTES[noteStep % LULLABY_NOTES.length], musicAudioCtx.currentTime);
        noteStep++;

        gain.gain.setValueAtTime(0.015, musicAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, musicAudioCtx.currentTime + 1.8);

        osc.connect(gain);
        gain.connect(musicAudioCtx.destination);
        osc.start();
        osc.stop(musicAudioCtx.currentTime + 1.8);
      } catch (e) {}
    }

    function toggleBgmMusic() {
      initBgmEngine();
      bgmEnabled = !bgmEnabled;
      document.getElementById('bgmLabel').textContent = bgmEnabled ? 'ดนตรี: เปิด' : 'ดนตรี: ปิด';
      document.getElementById('bgmIcon').textContent = bgmEnabled ? '🎵' : '🔇';
      
      if (bgmEnabled && isPlaying) {
        startBgmLoop();
      } else {
        stopBgmLoop();
      }
    }

    function startBgmLoop() {
      stopBgmLoop();
      if (!bgmEnabled) return;
      playSoftChime();
      bgmInterval = setInterval(playSoftChime, 2200);
    }

    function stopBgmLoop() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    // 4. SPEECH NARRATION LOGIC
    function speakParagraph(index, onComplete) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const story = STORIES_DATA[currentStoryIdx];
      if (index >= story.paragraphs.length) {
        handleStoryFinished();
        return;
      }

      currentParaIdx = index;
      updateActiveParaHighlight(index);

      const para = story.paragraphs[index];
      const text = narrationLang === 'en' ? para.en : para.th;
      const langCode = narrationLang === 'en' ? 'en-US' : 'th-TH';

      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = langCode;
      ut.rate = speechRate;
      ut.pitch = (narrationLang === 'en' ? 1.02 : 1.0);

      // Best voice selection
      const voices = window.speechSynthesis.getVoices();
      const matchedVoice = voices.find(v => v.lang.startsWith(narrationLang === 'en' ? 'en' : 'th'));
      if (matchedVoice) ut.voice = matchedVoice;

      ut.onend = () => {
        if (!isPlaying) return;
        setTimeout(() => {
          if (isPlaying) {
            speakParagraph(index + 1, onComplete);
          }
        }, 700);
      };

      ut.onerror = () => {
        if (!isPlaying) return;
        setTimeout(() => {
          if (isPlaying) speakParagraph(index + 1, onComplete);
        }, 500);
      };

      window.speechSynthesis.speak(ut);
    }

    function togglePlayNarration() {
      initBgmEngine();
      if (isPlaying) {
        pauseNarration();
      } else {
        playNarration();
      }
    }

    function playNarration() {
      isPlaying = true;
      document.getElementById('mainPlayIcon').className = 'fa-solid fa-pause';
      document.getElementById('btnMainPlay').classList.remove('anim-play-pulse');
      document.getElementById('audioWaveBox').classList.remove('hidden');
      
      const heroImg = document.getElementById('sceneHeroImg');
      if (heroImg) heroImg.classList.add('anim-kenburns');

      startBgmLoop();

      if (currentParaIdx < 0 || currentParaIdx >= STORIES_DATA[currentStoryIdx].paragraphs.length) {
        currentParaIdx = 0;
      }
      speakParagraph(currentParaIdx);
    }

    function pauseNarration() {
      isPlaying = false;
      document.getElementById('mainPlayIcon').className = 'fa-solid fa-play ml-0.5';
      document.getElementById('btnMainPlay').classList.add('anim-play-pulse');
      document.getElementById('audioWaveBox').classList.add('hidden');
      
      const heroImg = document.getElementById('sceneHeroImg');
      if (heroImg) heroImg.classList.remove('anim-kenburns');

      stopBgmLoop();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function restartStoryAudio() {
      pauseNarration();
      currentParaIdx = 0;
      updateActiveParaHighlight(0);
      setTimeout(playNarration, 100);
    }

    function tapParagraphToPlay(idx) {
      initBgmEngine();
      currentParaIdx = idx;
      updateActiveParaHighlight(idx);
      playNarration();
    }

    function updateActiveParaHighlight(activeIdx) {
      const boxes = document.querySelectorAll('.para-box');
      boxes.forEach((box, i) => {
        if (i === activeIdx) {
          box.classList.add('para-active');
          box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          box.classList.remove('para-active');
        }
      });

      // Update scene stage illustration and page badge
      const story = STORIES_DATA[currentStoryIdx];
      const currentPara = story.paragraphs[activeIdx];
      if (currentPara && currentPara.img) {
        const heroImg = document.getElementById('sceneHeroImg');
        if (heroImg && !heroImg.src.endsWith(currentPara.img)) {
          heroImg.style.opacity = '0.5';
          heroImg.src = currentPara.img;
          setTimeout(() => { heroImg.style.opacity = '1'; }, 120);
        }
      }
      const pageBadge = document.getElementById('scenePageBadge');
      if (pageBadge) {
        pageBadge.textContent = `ฉากที่ ${activeIdx + 1}/${story.paragraphs.length}`;
      }
    }

    function setNarrationLang(lang) {
      narrationLang = lang;
      document.getElementById('btnLangEn').className = (lang === 'en') ? 'px-2.5 py-1 rounded-lg font-black transition active:scale-95 bg-white text-amber-700 shadow-xs' : 'px-2.5 py-1 rounded-lg text-slate-600 transition active:scale-95';
      document.getElementById('btnLangTh').className = (lang === 'th') ? 'px-2.5 py-1 rounded-lg font-black transition active:scale-95 bg-white text-amber-700 shadow-xs' : 'px-2.5 py-1 rounded-lg text-slate-600 transition active:scale-95';

      renderParagraphs();
      if (isPlaying) {
        speakParagraph(currentParaIdx);
      }
    }

    function toggleSpeechRate() {
      if (speechRate === 0.85) speechRate = 1.0;
      else if (speechRate === 1.0) speechRate = 1.2;
      else speechRate = 0.85;

      document.getElementById('rateLabel').textContent = `${speechRate}x`;
      if (isPlaying) {
        speakParagraph(currentParaIdx);
      }
    }

    // 5. UI RENDERING
    function renderStoryTabs() {
      const container = document.getElementById('storyTabs');
      container.innerHTML = STORIES_DATA.map((st, idx) => {
        const isActive = (idx === currentStoryIdx);
        return `
          <button onclick="selectStory(${idx})" class="shrink-0 px-3.5 py-2 rounded-2xl text-xs font-black transition active:scale-95 flex items-center gap-1.5 border ${isActive ? 'bg-amber-500 text-white border-amber-600 shadow-sm' : 'bg-white hover:bg-amber-50 text-slate-700 border-amber-200/80'}">
            <span>${st.emojis[0]}</span>
            <span>${st.title}</span>
          </button>
        `;
      }).join('');
    }

    function renderStage() {
      const st = STORIES_DATA[currentStoryIdx];
      document.getElementById('sceneStoryTitle').textContent = st.title;
      document.getElementById('sceneStorySubtitle').textContent = st.thTitle;
      document.getElementById('sceneBadgeIcon').textContent = st.badge;
      
      const firstImg = st.paragraphs[0] ? st.paragraphs[0].img : '/assets/stories/magic_library_1.jpg';
      const heroImg = document.getElementById('sceneHeroImg');
      if (heroImg) {
        heroImg.src = firstImg;
        heroImg.style.opacity = '1';
      }
      
      const pageBadge = document.getElementById('scenePageBadge');
      if (pageBadge) {
        pageBadge.textContent = `ฉากที่ 1/${st.paragraphs.length}`;
      }
    }

    function renderParagraphs() {
      const st = STORIES_DATA[currentStoryIdx];
      const container = document.getElementById('storyParagraphsContainer');

      container.innerHTML = st.paragraphs.map((p, idx) => {
        return `
          <div onclick="tapParagraphToPlay(${idx})" class="para-box bg-white rounded-2xl p-3 sm:p-4 border-2 border-slate-100 shadow-xs cursor-pointer hover:border-amber-300 transition" id="para_box_${idx}">
            <div class="flex items-start gap-3">
              <!-- Scene Illustration Thumbnail -->
              <div class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-xl overflow-hidden shadow-xs shrink-0 border border-slate-200 bg-slate-100">
                <img src="${p.img}" alt="Scene #${idx+1}" class="w-full h-full object-cover hover:scale-105 transition duration-300" loading="lazy" />
                <span class="absolute bottom-1 right-1 px-1.5 py-0.5 rounded-md bg-black/60 backdrop-blur-xs text-[9px] font-black text-white">#${idx+1}</span>
              </div>
              <div class="flex-1 space-y-1">
                <!-- English Text -->
                <p class="text-sm sm:text-base font-bold leading-relaxed text-slate-800 ${narrationLang === 'en' ? 'font-story text-slate-900 font-extrabold' : ''}">
                  ${p.en}
                </p>
                <!-- Thai Translation -->
                <p class="text-xs sm:text-sm font-medium leading-normal text-slate-500 font-thai border-t border-slate-100 pt-1">
                  ${p.th}
                </p>
              </div>
              <button class="w-7 h-7 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-600 flex items-center justify-center text-xs shrink-0 transition" title="แตะฟังประโยคนี้">
                <i class="fa-solid fa-volume-high text-[11px]"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectStory(idx) {
      pauseNarration();
      currentStoryIdx = idx;
      currentParaIdx = 0;
      renderStoryTabs();
      renderStage();
      renderParagraphs();
      updateActiveParaHighlight(0);
    }

    function nextStory() {
      pauseNarration();
      currentStoryIdx = (currentStoryIdx + 1) % STORIES_DATA.length;
      currentParaIdx = 0;
      renderStoryTabs();
      renderStage();
      renderParagraphs();
      updateActiveParaHighlight(0);
    }

    // 6. COMPLETION REWARDS
    function handleStoryFinished() {
      pauseNarration();
      finishStoryReward();
    }

    function finishStoryReward() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 80,
          origin: { y: 0.6 }
        });
      }

      userStars += 5;
      localStorage.setItem('KB_STARS', userStars);
      document.getElementById('starsChip').textContent = userStars;

      if (window.KidobitsWallet) {
        try {
          KidobitsWallet.addReward({ stars: 5, coins: 25 });
        } catch (e) {}
      }

      document.getElementById('storyWinModal').classList.remove('hidden');
    }

    function closeWinModal() {
      document.getElementById('storyWinModal').classList.add('hidden');
    }

    // 7. INITIALIZE ON LOAD
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const storyParam = urlParams.get('story');
      if (storyParam) {
        const foundIdx = STORIES_DATA.findIndex(s => s.id === storyParam);
        if (foundIdx !== -1) currentStoryIdx = foundIdx;
      }
      document.getElementById('starsChip').textContent = userStars;
      renderStoryTabs();
      renderStage();
      renderParagraphs();
      updateActiveParaHighlight(0);
    });
  </script>
