input.ans.filled{border-color:#2f7d55;background:#0f1f18}
.hint{font-size:9px;color:#4e5768;margin-top:5px;word-break:break-all}
.hint b{color:#8fa3bf}
#bar{position:fixed;bottom:0;left:0;right:0;background:#11161f;border-top:1px solid #232936;padding:9px 12px;display:flex;gap:9px;align-items:center}
#cnt{font-size:12px;color:#8fa3bf;min-width:74px}
button{flex:1;padding:11px;border-radius:9px;border:0;background:#6ee7a8;color:#08211a;font-weight:700;font-size:14px}

<script>
document.querySelectorAll('input.ans').forEach(i=>{
  i.addEventListener('input',()=>{ i.classList.toggle('filled', i.value.trim().length>0); cnt(); });
});
function cnt(){ document.getElementById('cnt').textContent = document.querySelectorAll('input.ans.filled').length+' / 81'; }
function sendIt(){
  const out=[];
  document.querySelectorAll('input.ans').forEach(i=>{
    const v=i.value.trim().toLowerCase();
    if(v) out.push({n:+i.dataset.n, hash:i.dataset.hash, word:v});
  });
  const txt=JSON.stringify(out);
  console.log('RENAME',txt);
  try{ navigator.clipboard.writeText(txt); }catch(e){}
  document.getElementById('cnt').textContent='คัดลอกแล้ว';
  alert('คัดลอก '+out.length+' รายการแล้ว — วางในแชทได้เลย');
}
