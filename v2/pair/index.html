<script>
const N=106;
function submitAll(){
  const out=[];
  document.querySelectorAll('input.ans').forEach(inp=>{
    const v=inp.value.trim().toLowerCase();
    if(v){ out.push({i:+inp.dataset.i,correct:v}); inp.classList.add('ok'); }
  });
  const txt=JSON.stringify(out);
  document.getElementById('out').textContent='คัดลอกข้อความนี้ส่งให้ผู้ช่วย → '+txt;
  navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{});
  console.log('PAIRING',txt);
}
</script></body></html>
