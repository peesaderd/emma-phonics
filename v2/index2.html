<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kidobits Phonics — 6 ระดับ</title>
<meta name="theme-color" content="#7C5CFF">
<style>
:root{
  --bg:#12082B; --bg2:#1A0B2E; --panel:#221041;
  --ink:#0A0418; --fg:#FFFEF5; --muted:#A99FC9;
  --cyan:#00F5FF; --gold:#FFD700; --pink:#FF1493; --lime:#39FF14;
  --shadow:8px 8px 0 var(--ink); --shadow-sm:5px 5px 0 var(--ink);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Kanit',-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",
  "Sarabun",Roboto,sans-serif;background:var(--bg);color:var(--fg);
  background-image:
    radial-gradient(900px 500px at 15% -10%,rgba(0,245,255,.18),transparent 65%),
    radial-gradient(800px 460px at 92% 8%,rgba(255,20,147,.16),transparent 65%),
    radial-gradient(700px 700px at 50% 115%,rgba(57,255,20,.09),transparent 70%);
  background-attachment:fixed;
  line-height:1.5;padding:0 0 40px;overflow-x:hidden}
.wrap{max-width:860px;margin:0 auto;padding:0 18px;position:relative;z-index:1}

/* ---------- hero / HUD ---------- */
.hero{position:relative;padding:22px 0 46px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 240px at 70% -30%,rgba(255,215,0,.16),transparent 70%)}
.hero .wrap{position:relative;z-index:2}
.logo{width:64px;height:64px;border-radius:18px;background:var(--gold);
  border:4px solid var(--ink);box-shadow:var(--shadow-sm);
  display:grid;place-items:center;font-size:32px}
h1{font-family:'Fredoka','Kanit',sans-serif;font-size:1.75rem;margin:14px 0 0;
  font-weight:700;color:var(--gold);letter-spacing:.4px;
  text-shadow:3px 3px 0 var(--ink)}
.hero p{margin:6px 0 0;font-size:.85rem;color:var(--muted);font-weight:500}

/* stat chips (HUD) */
.pills{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.pill{background:var(--panel);border:3px solid var(--ink);border-radius:14px;
  padding:7px 14px;font-size:.78rem;font-weight:700;
  box-shadow:var(--shadow-sm);font-family:'Fredoka','Kanit',sans-serif}
.pills .pill:nth-child(1){color:var(--cyan)}
.pills .pill:nth-child(2){color:var(--gold)}
.pills .pill:nth-child(3){color:var(--lime)}

/* mascot */
.buddy{position:absolute;right:16px;top:18px;width:96px;height:96px;
  border-radius:50%;background:var(--panel);border:4px solid var(--ink);
  box-shadow:var(--shadow-sm);display:grid;place-items:center;z-index:3;
  animation:bob 2.8s ease-in-out infinite}
.buddy svg{width:72px;height:72px;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ---------- warmup ---------- */
.warm{background:linear-gradient(150deg,var(--panel),var(--bg2));
  border:4px solid var(--ink);border-radius:var(--r);padding:15px;
  display:flex;align-items:center;gap:14px;margin:-28px 0 20px;
  position:relative;z-index:4;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .09s ease,box-shadow .09s ease}
.warm:active{transform:translate(5px,5px);box-shadow:3px 3px 0 var(--ink)}
.wic{width:60px;height:60px;flex:0 0 60px;border-radius:16px;background:var(--gold);
  border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  display:grid;place-items:center;font-size:31px}
.wt{font-family:'Fredoka','Kanit',sans-serif;font-size:.95rem;font-weight:700;
  color:var(--gold);line-height:1.3}
.ws{font-size:.76rem;color:var(--muted);margin-top:3px;font-weight:500}

/* ---------- level cards ---------- */
.lvgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:560px){.lvgrid{grid-template-columns:1fr 1fr}}
.lvcard{position:relative;border:4px solid var(--ink);border-radius:var(--r);
  padding:15px;display:flex;align-items:center;gap:14px;cursor:pointer;overflow:hidden;
  box-shadow:var(--shadow);color:#fff;
  transition:transform .09s ease,box-shadow .09s ease}
.lvcard:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 var(--ink)}
.lvcard:active{transform:translate(5px,5px);box-shadow:3px 3px 0 var(--ink)}
.lvcard:before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.10);top:-52px;right:-32px;pointer-events:none}
.lvcard:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;
  background:rgba(255,255,255,.07);bottom:-32px;left:44px;pointer-events:none}
.anim{width:60px;height:60px;flex:0 0 60px;border-radius:16px;background:var(--fg);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  display:grid;place-items:center;position:relative;z-index:2}
.anim svg{width:46px;height:46px;display:block}
.lvmeta{flex:1;min-width:0;position:relative;z-index:2}
.lvmeta h2{margin:0;font-family:'Fredoka','Kanit',sans-serif;
  font-size:1rem;font-weight:700;line-height:1.3;
  text-shadow:2px 2px 0 rgba(10,4,24,.55)}
.lvmeta .sub{font-size:.74rem;color:rgba(255,255,255,.92);margin-top:3px;
  font-weight:600;text-shadow:1px 1px 0 rgba(10,4,24,.45)}
.lvmeta .prog{font-family:'Fredoka','Kanit',sans-serif;
  font-size:.7rem;font-weight:700;margin-top:8px;display:inline-block;
  background:var(--gold);color:var(--ink);border:3px solid var(--ink);
  border-radius:10px;padding:3px 11px;box-shadow:2px 2px 0 var(--ink)}
.lvmeta .prog.done{background:var(--lime);color:var(--ink)}
.chev{font-family:'Fredoka','Kanit',sans-serif;font-size:.85rem;font-weight:700;
  color:var(--ink);background:var(--cyan);border:3px solid var(--ink);
  border-radius:12px;padding:8px 12px;position:relative;z-index:2;
  flex:0 0 auto;box-shadow:3px 3px 0 var(--ink)}

footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:34px;line-height:1.7}

/* ---------- modal (kept) ---------- */
.modal{position:fixed;inset:0;background:rgba(10,4,24,.72);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--panel);color:var(--fg);width:100%;max-width:560px;
  border:4px solid var(--ink);border-bottom:0;
  border-radius:22px 22px 0 0;padding:22px 20px 30px;max-height:82vh;overflow:auto;
  box-shadow:0 -8px 0 var(--ink)}
.sheet h3{margin:0 0 4px;font-size:1.1rem;font-family:'Fredoka','Kanit',sans-serif}
.sheet .sid{font-size:.78rem;color:var(--muted);font-weight:700}
.sheet .srow{margin:15px 0}
.sheet .srow b{font-size:.8rem;color:var(--cyan);display:block;margin-bottom:3px}
.sheet .srow p{margin:0;font-size:.9rem;color:#D9D2EC}
.btn{width:100%;border:4px solid var(--ink);border-radius:14px;padding:14px;
  font-size:.95rem;font-weight:700;font-family:'Fredoka','Kanit',sans-serif;
  margin-top:20px;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:var(--bg2);color:var(--fg)}
.btn.play{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.5}
@media(min-width:640px){.modal{align-items:center}
  .sheet{border-radius:22px;border-bottom:4px solid var(--ink)}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

const grid = document.getElementById('lvgrid');
const prog = PROG();
DATA.levels.forEach(lv => {
  const readyN = lv.lessons.filter(l => l.status==='ready').length;
  const doneN = lv.lessons.filter(l => (prog[l.id]||{}).done).length;
  const c = document.createElement('div');

  c.innerHTML =
    '<div class="anim">'+(SVG[lv.level]||'')+'</div>'+
    '<div class="lvmeta">'+
      '<h2>ระดับ '+lv.level+' · '+esc(lv.name)+'</h2>'+
      '<div class="sub">'+lv.count+' บทเรียน · '+readyN+'/'+lv.count+' พร้อม</div>'+
      '<span class="prog'+(doneN?' done':'')+'">'+(doneN?('✅ ผ่าน '+doneN+'/'+lv.count):('▶ เริ่มเลย'))+'</span>'+
    '</div>'+
    '<div class="chev">›</div>';
  c.addEventListener('click', () => { location.href = 'level.html?lv=' + lv.level; });
  grid.appendChild(c);
});

/* ทำให้สีอ่อนลงสำหรับปลาย gradient */
function lighten(hex){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.min(255,Math.round(r+ (255-r)*0.42));
  g=Math.min(255,Math.round(g+ (255-g)*0.42));
  b=Math.min(255,Math.round(b+ (255-b)*0.42));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
