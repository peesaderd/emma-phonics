<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFFDF9">
  <title>Kidobits Hanzi Studio · คลังฝึกเขียนอักษรจีนพู่กันอัจฉริยะ 🐼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Noto+Sans+Thai:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Plus Jakarta Sans', 'Noto Sans Thai', 'sans-serif'],
            thai: ['Noto Sans Thai', 'sans-serif'],
            zh: ['"WenQuanYi Zen Hei"', '"Noto Sans CJK SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif']
          },
          colors: {
            panda: {
              50: '#FDF8F6',
              100: '#F2E8E5',
              200: '#EADDD7',
              500: '#C2410C',
              600: '#EA580C',
              800: '#7C2D12',
              900: '#431407'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100%;
      font-family: 'Noto Sans Thai', 'Plus Jakarta Sans', sans-serif;
      overscroll-behavior-y: auto;
      background-color: #FFFDF9;
    }
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    nav.fixed[class*="bottom-"] {
      bottom: max(12px, calc(10px + env(safe-area-inset-bottom, 0px))) !important;
    }
    .font-brush {
      font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', 'BiauKai', 'DFKai-SB', 'AR PL UKai CN', '楷体', '楷体_GB2312', 'Noto Serif SC', serif !important;
      letter-spacing: 0.05em;
    }
    .zh-font {
      font-family: 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    /* Tianzi Ge (田字格) / Mizi Ge (米字格) Grid */
    .mizi-box {
      position: relative;
      background-color: #FFFFFF;
      background-image:
        linear-gradient(to right, rgba(239, 68, 68, 0.28) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(239, 68, 68, 0.28) 1.5px, transparent 1.5px),
        linear-gradient(45deg, transparent calc(50% - 0.75px), rgba(239, 68, 68, 0.16) calc(50% - 0.75px), rgba(239, 68, 68, 0.16) calc(50% + 0.75px), transparent calc(50% + 0.75px)),
        linear-gradient(-45deg, transparent calc(50% - 0.75px), rgba(239, 68, 68, 0.16) calc(50% - 0.75px), rgba(239, 68, 68, 0.16) calc(50% + 0.75px), transparent calc(50% + 0.75px));
      background-size: 50% 50%, 50% 50%, 100% 100%, 100% 100%;
      background-position: center center;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .pulse-btn {
      animation: pulseGlow 2s infinite ease-in-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 select-none bg-[#FFFDF9] pb-28 overscroll-y-auto">

  <!-- 1. STANDARD KIDOBITS TOP BAR -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-orange-100 shadow-xs">
    <div class="max-w-4xl mx-auto px-3 py-2 flex items-center justify-between gap-2">
      <!-- Back Button -->
      <button onclick="if (history.length > 1) { history.back(); } else { location.href='/theme/theme_chinese_lobby.html'; }" class="btn-press flex items-center gap-1 px-3 py-1.5 rounded-full bg-white shadow-xs border border-slate-200 text-xs font-bold text-slate-700 hover:bg-slate-50 transition active:scale-95" title="ย้อนกลับ">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        <span>กลับ</span>
      </button>

      <!-- Center Title Badge -->
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-black text-slate-800">🇨🇳 Hanzi Studio</span>
        <button onclick="openCategoryModal()" class="px-2.5 py-1 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-800 text-[11px] font-black border border-orange-200 transition active:scale-95 flex items-center gap-1">
          <i class="fa-solid fa-book-open text-[10px] text-orange-500"></i>
          <span id="headerCatName" class="max-w-[75px] sm:max-w-none truncate">ตัวเลข</span>
          <i class="fa-solid fa-chevron-down text-[8px] opacity-60"></i>
        </button>
      </div>

      <!-- Right Stats Chips -->
      <div class="flex items-center gap-1.5">
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-red-50 border border-red-100 text-[11px] font-black text-red-600 shadow-2xs">
          <span>🔥</span>
          <span id="streakChip">7</span>
        </div>
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-50 border border-amber-100 text-[11px] font-black text-amber-600 shadow-2xs">
          <span>⭐</span>
          <span id="starCounter">0</span>
        </div>
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-100 text-[11px] font-black text-emerald-600 shadow-2xs">
          <span>🪙</span>
          <span id="userCoins">240</span>
        </div>
      </div>
    </div>
    <!-- Hidden legacy elements for JS safety -->
    <span id="headerCharDisplay" class="hidden"></span>
    <span id="headerPinyinDisplay" class="hidden"></span>
    <span id="headerThaiDisplay" class="hidden"></span>
  </header>

  <!-- 2. MAIN WORKSPACE CONTAINER (FITS 1 SCREEN) -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-3 flex flex-col justify-between py-2">

    <!-- CHARACTER SELECTOR HORIZONTAL MINI-SHELF (Compact ~38px) -->
    <div class="shrink-0 w-full overflow-hidden">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5" id="charShelf">
        <!-- Character mini-pills rendered by JS -->
      </div>
    </div>

    <!-- MAIN INTERACTIVE ARENA -->
    <div class="flex-1 flex flex-col items-center justify-center min-h-0 py-1">

      <!-- Centered Character Example Showcase (ตรงกลาง ชัดเจน ตัวใหญ่) -->
      <div class="shrink-0 flex flex-col items-center justify-center text-center mb-1.5 px-4 py-1.5 rounded-2xl bg-white/95 border border-orange-200/90 shadow-xs max-w-xs w-full relative">
        <!-- Floating Speaker Button in top right -->
        <button onclick="speakCurrentChar()" class="absolute top-2 right-2.5 w-7 h-7 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-600 border border-orange-200 flex items-center justify-center transition active:scale-90" title="ฟังเสียงอ่าน">
          <i class="fa-solid fa-volume-high text-[11px]"></i>
        </button>

        <!-- Big Brush Calligraphy Character Centerpiece -->
        <div class="flex items-center justify-center py-0.5">
          <span id="exampleCharTile" class="text-6xl sm:text-7xl font-brush text-slate-900 leading-none drop-shadow-xs transition-transform hover:scale-105 select-none">
            一
          </span>
        </div>

        <!-- Pinyin, Stroke Count & Thai Meaning Centered Below -->
        <div class="flex items-center justify-center gap-1.5 mt-1 flex-wrap">
          <span id="examplePinyin" class="text-base font-black text-orange-600 tracking-wide">yī</span>
          <span class="text-slate-300 font-bold">•</span>
          <span id="exampleMeaning" class="text-xs font-bold text-slate-700">หนึ่ง (1)</span>
          <span id="exampleStrokeCount" class="text-[9.5px] px-1.5 py-0.2 rounded-md bg-orange-100 text-orange-800 font-bold ml-0.5">1 ขีด</span>
        </div>
      </div>

      <!-- Mode Selector Switcher (Compact ~34px) -->
      <div class="shrink-0 w-full max-w-xs flex items-center justify-center gap-1 mb-2 bg-slate-100/90 p-1 rounded-2xl shadow-xs">
        <button onclick="setMode('animate')" id="btnModeAnimate" class="flex-1 py-1 px-2 rounded-xl text-xs font-bold text-slate-600 transition flex items-center justify-center gap-1">
          <i class="fa-solid fa-play text-[10px]"></i>
          <span>ดูตัวอย่าง</span>
        </button>
        <button onclick="setMode('guided')" id="btnModeGuided" class="flex-1 py-1 px-2 rounded-xl text-xs font-bold text-slate-600 transition flex items-center justify-center gap-1">
          <i class="fa-solid fa-pen text-[10px]"></i>
          <span>เขียนตามรอย</span>
        </button>
        <button onclick="setMode('quiz')" id="btnModeQuiz" class="flex-1 py-1 px-2 rounded-xl text-xs font-black bg-white text-orange-600 shadow-sm transition flex items-center justify-center gap-1">
          <i class="fa-solid fa-graduation-cap text-[10px]"></i>
          <span>ทดสอบเขียน</span>
        </button>
      </div>

      <!-- Tianzi Ge Canvas Box with Authentic Brush Watermark -->
      <div class="relative w-[240px] h-[240px] sm:w-[280px] sm:h-[280px] rounded-3xl border-4 border-rose-300 mizi-box shadow-md overflow-hidden flex items-center justify-center touch-none shrink-0">
        <!-- Brush Watermark Guide in Background -->
        <div id="brushWatermark" class="absolute inset-0 flex items-center justify-center text-8xl sm:text-9xl font-brush text-rose-200/45 pointer-events-none select-none">
          一
        </div>
        <div id="hanziWriterTarget" class="w-full h-full flex items-center justify-center cursor-crosshair relative z-10"></div>
        
        <!-- Watermark label -->
        <div class="absolute bottom-1.5 right-2 text-[9px] font-bold text-rose-300/80 pointer-events-none select-none">
          田字格
        </div>
      </div>

      <!-- Dynamic Status / Feedback Strip (Compact ~26px) -->
      <div id="feedbackText" class="h-7 mt-1.5 flex items-center justify-center text-xs font-black text-slate-700 text-center px-2">
        แตะหรือลากเส้นตามลำดับขีดในกรอบได้เลยค่ะ ✍️
      </div>

    </div>

    <!-- 3. BOTTOM CONTROL ACTION BUTTONS (~44px) -->
    <div class="shrink-0 w-full max-w-sm mx-auto flex items-center justify-center gap-2 pb-1.5 pt-0.5">
      <button onclick="actionHint()" class="flex-1 py-2 px-2.5 rounded-2xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold border border-amber-200 transition active:scale-95 flex items-center justify-center gap-1">
        <i class="fa-solid fa-wand-magic-sparkles text-xs text-amber-600"></i>
        <span>ใบ้เส้น</span>
      </button>
      <button onclick="actionReset()" class="flex-1 py-2 px-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold border border-slate-200 transition active:scale-95 flex items-center justify-center gap-1">
        <i class="fa-solid fa-rotate-right text-xs"></i>
        <span>ลบเขียนใหม่</span>
      </button>
      <button id="btnNextChar" onclick="actionNextChar()" class="flex-1 py-2 px-3 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white text-xs font-black shadow-md shadow-orange-500/20 transition active:scale-95 flex items-center justify-center gap-1">
        <span>ตัวถัดไป</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </div>

  </main>

  <!-- CATEGORY SELECTION MODAL (OPENS ONLY WHEN TAPPED) -->
  <div id="categoryModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 hidden" onclick="if(event.target === this) closeCategoryModal();">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl border border-orange-100 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 class="text-sm font-black text-slate-900 flex items-center gap-1.5">
          <i class="fa-solid fa-book-open text-orange-500"></i>
          <span>เลือกหมวดหมู่ตัวอักษรจีน</span>
        </h3>
        <button onclick="closeCategoryModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 flex items-center justify-center text-xs">
          ✕
        </button>
      </div>

      <div class="grid grid-cols-1 gap-2" id="modalCategoryList">
        <!-- Rendered by JS -->
      </div>

      <!-- Custom character input in modal -->
      <div class="pt-2 border-t border-slate-100">
        <div class="text-[11px] font-bold text-slate-500 mb-1.5">หรือพิมพ์ตัวอักษรจีนที่ต้องการคัดเอง:</div>
        <div class="flex items-center gap-1.5">
          <input type="text" id="customCharInput" maxlength="1" placeholder="พิมพ์ตัวจีน เช่น 木" class="flex-1 text-center px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:border-orange-500 font-brush text-xl" />
          <button onclick="loadCustomChar()" class="px-4 py-2 text-xs font-black bg-orange-600 hover:bg-orange-700 text-white rounded-xl transition active:scale-95">
            คัดตัวนี้ ➔
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <script>
    // 1. DATA REPOSITORY (CURATED CHARACTER SETS)
    const CATEGORIES = [
      {
        id: 'numbers',
        name: 'ตัวเลข (1-10)',
        icon: '🔢',
        chars: [
          { char: '一', py: 'yī', th: 'หนึ่ง (1)', strokes: 1, radical: '一', hint: 'ขีดแนวนอนจากซ้ายไปขวา (横)' },
          { char: '二', py: 'èr', th: 'สอง (2)', strokes: 2, radical: '二', hint: 'ขีดบนสั้น ขีดล่างยาว (横, 横)' },
          { char: '三', py: 'sān', th: 'สาม (3)', strokes: 3, radical: '一', hint: 'สามขีด ขีดกลางสั้นสุด ขีดล่างยาวสุด' },
          { char: '四', py: 'sì', th: 'สี่ (4)', strokes: 5, radical: '囗', hint: 'กรอบนอก ใส่ขีดข้างใน แล้วปิดฐาน' },
          { char: '五', py: 'wǔ', th: 'ห้า (5)', strokes: 4, radical: '二', hint: 'ขีดบน เส้นตั้งเอียง ขีดหัก แล้วปิดฐาน' },
          { char: '六', py: 'liù', th: 'หก (6)', strokes: 4, radical: '八', hint: 'จุดบน ขีดกลาง จุดซ้ายและจุดขวา' },
          { char: '七', py: 'qī', th: 'เจ็ด (7)', strokes: 2, radical: '一', hint: 'ขีดขวาง แล้วลากขีดตั้งโค้งเกี่ยว' },
          { char: '八', py: 'bā', th: 'แปด (8)', strokes: 2, radical: '八', hint: 'ปัดซ้าย 撇 แล้วปัดขวา 捺 ไม่ติดกัน' },
          { char: '九', py: 'jiǔ', th: 'เก้า (9)', strokes: 2, radical: '丿', hint: 'ปัดซ้ายก่อน แล้วลากเส้นหักเกี่ยว' },
          { char: '十', py: 'shí', th: 'สิบ (10)', strokes: 2, radical: '十', hint: 'ขีดนอนก่อน แล้วขีดตั้งผ่ากลาง' }
        ]
      },
      {
        id: 'nature',
        name: 'ธรรมชาติ & ธาตุ',
        icon: '🌿',
        chars: [
          { char: '日', py: 'rì', th: 'ดวงอาทิตย์ / วัน', strokes: 4, radical: '日', hint: 'ตั้งซ้าย ขีดหัก ขีดกลาง ปิดล่าง' },
          { char: '月', py: 'yuè', th: 'ดวงจันทร์ / เดือน', strokes: 4, radical: '月', hint: 'ปัดซ้าย ขีดหักเกี่ยว สองขีดกลาง' },
          { char: '水', py: 'shuǐ', th: 'น้ำ', strokes: 4, radical: '水', hint: 'ขีดตั้งเกี่ยวตรงกลางก่อน แล้วซ้ายขวา' },
          { char: '火', py: 'huǒ', th: 'ไฟ', strokes: 4, radical: '火', hint: 'จุดซ้าย จุดขวา แล้วปัดซ้าย ปัดขวา' },
          { char: '木', py: 'mù', th: 'ต้นไม้ / ไม้', strokes: 4, radical: '木', hint: 'ขีดนอน ขีดตั้งตรงกลาง ปัดซ้าย ปัดขวา' },
          { char: '金', py: 'jīn', th: 'ทอง / โลหะ', strokes: 8, radical: '金', hint: 'ปัดซ้ายขวาบน ขีดนอน จุดซ้ายขวา ปิดล่าง' },
          { char: '土', py: 'tǔ', th: 'ดิน', strokes: 3, radical: '土', hint: 'ขีดนอนสั้น ขีดตั้ง ขีดนอนยาวฐานล่าง' },
          { char: '山', py: 'shān', th: 'ภูเขา', strokes: 3, radical: '山', hint: 'ขีดตั้งตรงกลางก่อน ลากหักซ้าย ขีดตั้งขวา' },
          { char: '石', py: 'shí', th: 'หิน', strokes: 5, radical: '石', hint: 'ขีดนอน ปัดซ้าย แล้วเขียน 口 ด้านล่าง' },
          { char: '田', py: 'tián', th: 'ทุ่งนา', strokes: 5, radical: '田', hint: 'กรอบนอก ขีดตั้ง ขีดนอนผ่ากลาง แล้วปิดฐาน' }
        ]
      },
      {
        id: 'body',
        name: 'ครอบครัว & คน',
        icon: '👨‍👩‍👧',
        chars: [
          { char: '人', py: 'rén', th: 'คน', strokes: 2, radical: '人', hint: 'ปัดซ้าย 撇 แล้วปัดขวา 捺 ทรงพลัง' },
          { char: '口', py: 'kǒu', th: 'ปาก', strokes: 3, radical: '口', hint: 'ตั้งซ้าย ขีดหักมุม ปิดฐานล่าง' },
          { char: '目', py: 'mù', th: 'ดวงตา', strokes: 5, radical: '目', hint: 'ตั้งซ้าย ขีดหัก สองขีดใน ปิดล่าง' },
          { char: '手', py: 'shǒu', th: 'มือ', strokes: 4, radical: '手', hint: 'ปัดซ้ายบน ขีดนอนสองเส้น ขีดตั้งโค้งเกี่ยว' },
          { char: '耳', py: 'ěr', th: 'หู', strokes: 6, radical: '耳', hint: 'ขีดนอนบน เส้นตั้งสองเส้น ขีดกลาง ขีดล่าง' },
          { char: '心', py: 'xīn', th: 'หัวใจ / ใจ', strokes: 4, radical: '心', hint: 'จุดซ้าย โค้งเกี่ยว จุดกลาง จุดขวา' },
          { char: '女', py: 'nǚ', th: 'ผู้หญิง', strokes: 3, radical: '女', hint: 'เส้นหักมุม ปัดซ้าย ขีดนอนยาวตัดขวาง' },
          { char: '子', py: 'zǐ', th: 'เด็ก / ลูก', strokes: 3, radical: '子', hint: 'ขีดหักบน เส้นโค้งเกี่ยว ขีดนอนตัด' }
        ]
      },
      {
        id: 'adjectives',
        name: 'ขนาด & ทิศทาง',
        icon: '↔️',
        chars: [
          { char: '大', py: 'dà', th: 'ใหญ่', strokes: 3, radical: '大', hint: 'ขีดนอน ปัดซ้าย ปัดขวา' },
          { char: '小', py: 'xiǎo', th: 'เล็ก', strokes: 3, radical: '小', hint: 'ขีดตั้งเกี่ยวตรงกลางก่อน แล้วจุดซ้ายขวา' },
          { char: '上', py: 'shàng', th: 'บน / ขึ้น', strokes: 3, radical: '一', hint: 'ขีดตั้ง ขีดนอนสั้น ขีดนอนยาว' },
          { char: '下', py: 'xià', th: 'ล่าง / ลง', strokes: 3, radical: '一', hint: 'ขีดนอนยาว ขีดตั้ง จุดขวา' },
          { char: '中', py: 'zhōng', th: 'กลาง / จีน', strokes: 4, radical: '丨', hint: 'เขียน 口 ก่อน แล้วขีดตั้งยาวผ่ากลาง' },

          { char: '好', py: 'hǎo', th: 'ดี', strokes: 6, radical: '女', hint: 'ผู้หญิง 女 ทางซ้าย ลูก 子 ทางขวา' },
          { char: '爸', py: 'bà', th: 'คุณพ่อ', strokes: 8, radical: '父', hint: 'หมวดพ่อ 父 ด้านบน 巴 ด้านล่าง' },
          { char: '妈', py: 'mā', th: 'คุณแม่', strokes: 6, radical: '女', hint: 'หมวดหญิง 女 ด้านซ้าย ม้า 马 ด้านขวา' },
          { char: '门', py: 'mén', th: 'ประตู', strokes: 3, radical: '门', hint: 'จุดซ้าย ตั้งซ้าย ขีดหักเกี่ยว' },
          { char: '书', py: 'shū', th: 'หนังสือ', strokes: 4, radical: '乙', hint: 'ขีดหักบนสองชั้น ขีดตั้งยาว จุดขวา' },
          { char: '天', py: 'tiān', th: 'ท้องฟ้า / วัน', strokes: 4, radical: '大', hint: 'ขีดนอนบน แล้วเขียน 大 ข้างล่าง' }
        ]
      }
    ];

    // 2. APP STATE
    let currentCategoryIndex = 0;
    let currentCharIndex = 0;
    let currentCharObj = CATEGORIES[0].chars[0];
    let currentMode = 'quiz'; // 'animate', 'guided', 'quiz'
    let writer = null;
    let userStars = parseInt(localStorage.getItem('KB_STARS') || '0', 10);
    window.__cnNextTimer = null;

    // Audio Context for UI Sound FX
    function playTone(type) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const t = ctx.currentTime;

        if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.08);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
          osc.start(t);
          osc.stop(t + 0.09);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.linearRampToValueAtTime(140, t + 0.15);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
          osc.start(t);
          osc.stop(t + 0.16);
        } else if (type === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, t);
          osc.frequency.setValueAtTime(659.25, t + 0.09);
          osc.frequency.setValueAtTime(783.99, t + 0.18);
          osc.frequency.setValueAtTime(1046.50, t + 0.28);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.48);
          osc.start(t);
          osc.stop(t + 0.5);
        }
      } catch(e) {}
    }

    function speakCurrentChar() {
      if (!currentCharObj) return;
      const text = currentCharObj.char;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = 'zh-CN';
        ut.rate = 0.85;
        window.speechSynthesis.speak(ut);
      }
    }

    function updateStarsDisplay() {
      document.getElementById('starCounter').textContent = userStars;
      localStorage.setItem('KB_STARS', userStars);
    }

    // 3. UI RENDERING
    function renderCharShelf() {
      const cat = CATEGORIES[currentCategoryIndex];
      const shelf = document.getElementById('charShelf');
      shelf.innerHTML = cat.chars.map((item, idx) => {
        const isCurrent = (item.char === currentCharObj.char);
        return `
          <button onclick="selectChar(${idx})" class="shrink-0 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition border active:scale-95 ${isCurrent ? 'bg-orange-500 text-white border-orange-600 shadow-sm scale-105' : 'bg-white hover:bg-orange-50 text-slate-800 border-slate-200'}">
            <span class="text-base font-brush">${item.char}</span>
            <span class="text-[10px] font-bold ${isCurrent ? 'text-orange-100' : 'text-slate-400'}">${item.py}</span>
          </button>
        `;
      }).join('');
    }

    function updateHeaderInfo() {
      const cat = CATEGORIES[currentCategoryIndex];
      document.getElementById('headerCatName').textContent = cat.name.split(' ')[0];
      document.getElementById('headerCharDisplay').textContent = currentCharObj.char;
      document.getElementById('headerPinyinDisplay').textContent = currentCharObj.py || '';
      document.getElementById('headerThaiDisplay').textContent = currentCharObj.th || '';

      // Update Compact Example Tile above mode buttons
      const exTile = document.getElementById('exampleCharTile');
      if (exTile) exTile.textContent = currentCharObj.char;
      const exPy = document.getElementById('examplePinyin');
      if (exPy) exPy.textContent = currentCharObj.py || '';
      const exStrokes = document.getElementById('exampleStrokeCount');
      if (exStrokes) exStrokes.textContent = (currentCharObj.strokes ? `${currentCharObj.strokes} ขีด` : '');
      const exMeaning = document.getElementById('exampleMeaning');
      if (exMeaning) exMeaning.textContent = currentCharObj.th || '';

      const watermark = document.getElementById('brushWatermark');
      if (watermark) watermark.textContent = currentCharObj.char;
    }

    function openCategoryModal() {
      const list = document.getElementById('modalCategoryList');
      list.innerHTML = CATEGORIES.map((cat, idx) => `
        <button onclick="selectCategory(${idx}); closeCategoryModal();" class="w-full px-4 py-3 rounded-2xl flex items-center justify-between transition border text-left active:scale-98 ${idx === currentCategoryIndex ? 'bg-orange-50 border-orange-300 text-orange-950 font-black' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}">
          <div class="flex items-center gap-2.5">
            <span class="text-xl">${cat.icon}</span>
            <div>
              <div class="text-xs font-black">${cat.name}</div>
              <div class="text-[10.5px] text-slate-400 font-medium">${cat.chars.length} ตัวอักษร</div>
            </div>
          </div>
          ${idx === currentCategoryIndex ? '<span class="text-xs font-black text-orange-600">✓ เลือกอยู่</span>' : '<i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>'}
        </button>
      `).join('');
      document.getElementById('categoryModal').classList.remove('hidden');
    }

    function closeCategoryModal() {
      document.getElementById('categoryModal').classList.add('hidden');
    }

    // 4. HANZI WRITER INITIALIZATION
    function getWriterSize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (w < 380 || h < 650) return 230;
      if (w < 640) return 250;
      return 280;
    }

    function initWriter() {
      if (window.__cnNextTimer) { clearTimeout(window.__cnNextTimer); window.__cnNextTimer = null; }
      const target = document.getElementById('hanziWriterTarget');
      target.innerHTML = '';
      const size = getWriterSize();

      try {
        writer = HanziWriter.create('hanziWriterTarget', currentCharObj.char, {
          width: size,
          height: size,
          padding: 14,
          showOutline: currentMode !== 'quiz',
          strokeAnimationSpeed: 1.2,
          delayBetweenStrokes: 150,
          strokeColor: '#0F172A',     // authentic deep black Chinese ink
          outlineColor: '#CBD5E1',    // soft outline guide
          drawingColor: '#2563EB',    // vibrant blue brush user stroke
          drawingWidth: 16,
          showHintAfterMisses: 2,
          highlightColor: '#10B981',  // emerald highlight
          onCorrectStroke: function(data) {
            playTone('pop');
            setFeedback(`✨ ขีดที่ ${data.strokeNum + 1} ถูกต้อง!`, 'text-blue-600 font-bold');
          },
          onMistake: function(data) {
            playTone('wrong');
            setFeedback('ยังไม่ตรงเส้น ลองสังเกตทิศทางขีดอีกครั้งนะคะ 🙂', 'text-rose-500 font-bold');
          },
          onComplete: function(summary) {
            onQuizPassed(summary);
          }
        });

        applyCurrentMode();
      } catch (err) {
        console.error('HanziWriter error:', err);
        setFeedback('เกิดข้อผิดพลาดในการโหลดตัวอักษร', 'text-rose-500');
      }
    }

    function applyCurrentMode() {
      if (!writer) return;

      // Update Tab Styles
      ['btnModeAnimate', 'btnModeGuided', 'btnModeQuiz'].forEach(id => {
        const btn = document.getElementById(id);
        btn.className = 'flex-1 py-1 px-2 rounded-xl text-xs font-bold text-slate-600 transition flex items-center justify-center gap-1';
      });

      const watermark = document.getElementById('brushWatermark');

      if (currentMode === 'animate') {
        document.getElementById('btnModeAnimate').className = 'flex-1 py-1 px-2 rounded-xl text-xs font-black bg-white text-orange-600 shadow-sm transition flex items-center justify-center gap-1';
        setFeedback('🎬 กำลังสาธิตลำดับขีดและทิศทาง...', 'text-orange-600 font-bold');
        if (watermark) watermark.style.opacity = '0.15';
        writer.showOutline();
        writer.animateCharacter({
          onComplete: () => {
            setFeedback('แอนิเมชันจบแล้ว แตะ "เขียนตามรอย" หรือ "ทดสอบ" เพื่อเริ่มคัดค่ะ ✍️', 'text-slate-600 font-bold');
          }
        });
      } else if (currentMode === 'guided') {
        document.getElementById('btnModeGuided').className = 'flex-1 py-1 px-2 rounded-xl text-xs font-black bg-white text-orange-600 shadow-sm transition flex items-center justify-center gap-1';
        setFeedback('✍️ ลากเส้นตามรอยโครงสร้างได้เลยค่ะ', 'text-slate-700 font-bold');
        if (watermark) watermark.style.opacity = '0.35';
        writer.showOutline();
        writer.quiz();
      } else if (currentMode === 'quiz') {
        document.getElementById('btnModeQuiz').className = 'flex-1 py-1 px-2 rounded-xl text-xs font-black bg-white text-orange-600 shadow-sm transition flex items-center justify-center gap-1';
        setFeedback('🧠 โหมดทดสอบ: เขียนจากความจำในตาราง田字格ได้เลยค่ะ!', 'text-orange-700 font-bold');
        if (watermark) watermark.style.opacity = '0.08';
        writer.hideOutline();
        writer.quiz();
      }
    }

    function setMode(mode) {
      currentMode = mode;
      applyCurrentMode();
    }

    function setFeedback(msg, colorClass) {
      const fb = document.getElementById('feedbackText');
      fb.className = `h-7 mt-1.5 flex items-center justify-center text-xs text-center px-2 ${colorClass || 'text-slate-700 font-bold'}`;
      fb.textContent = msg;
    }

    // 5. USER ACTIONS
    function selectCategory(idx) {
      currentCategoryIndex = idx;
      currentCharIndex = 0;
      currentCharObj = CATEGORIES[idx].chars[0];
      renderCharShelf();
      updateHeaderInfo();
      initWriter();
      speakCurrentChar();
    }

    function selectChar(idx) {
      currentCharIndex = idx;
      currentCharObj = CATEGORIES[currentCategoryIndex].chars[idx];
      renderCharShelf();
      updateHeaderInfo();
      initWriter();
      speakCurrentChar();
    }

    function loadCustomChar() {
      const input = document.getElementById('customCharInput');
      const val = (input.value || '').trim();
      if (!val) return;
      currentCharObj = {
        char: val,
        py: '',
        th: 'อักษรค้นหา',
        strokes: '?',
        radical: val,
        hint: 'ลากเส้นตามลำดับขีดที่ระบบแนะนำ'
      };
      closeCategoryModal();
      renderCharShelf();
      updateHeaderInfo();
      initWriter();
      speakCurrentChar();
      input.value = '';
    }

    function actionHint() {
      if (!writer) return;
      writer.highlightStroke();
      setFeedback('💡 ใบ้เส้นถัดไปให้แล้วค่ะ ลองลากตามเส้นสีเขียวนะคะ', 'text-amber-600 font-black');
    }

    function actionReset() {
      if (!writer) return;
      initWriter();
      setFeedback('ล้างกระดานเรียบร้อย เริ่มเขียนใหม่ได้เลยค่ะ 🔄', 'text-slate-500 font-bold');
    }

    function actionNextChar() {
      if (window.__cnNextTimer) { clearTimeout(window.__cnNextTimer); window.__cnNextTimer = null; }
      const cat = CATEGORIES[currentCategoryIndex];
      if (currentCharIndex + 1 < cat.chars.length) {
        selectChar(currentCharIndex + 1);
      } else {
        // Next category
        const nextCatIdx = (currentCategoryIndex + 1) % CATEGORIES.length;
        selectCategory(nextCatIdx);
      }
    }

    // 6. COMPLETION & REWARD (NO ANNOYING BOUNCY POPUP MODAL!)
    function onQuizPassed(summary) {
      playTone('win');
      confetti({
        particleCount: 75,
        spread: 70,
        origin: { y: 0.6 }
      });
      userStars += 1;
      updateStarsDisplay();

      // Show warm, celebratory praise directly on screen (NO MODAL POPUP)
      setFeedback(`🎉 เก่งมากค่ะ! คัดตัว "${currentCharObj.char}" (${currentCharObj.py}) สำเร็จครบถ้วน ⭐ +1 ดาว`, 'text-emerald-600 font-black animate-pop');

      // Speak praise in Mandarin
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance('太棒了！写得真漂亮！');
        ut.lang = 'zh-CN';
        ut.rate = 0.9;
        window.speechSynthesis.speak(ut);
      }

      // Highlight the next button
      const nextBtn = document.getElementById('btnNextChar');
      if (nextBtn) {
        nextBtn.classList.add('ring-4', 'ring-emerald-400');
        setTimeout(() => {
          nextBtn.classList.remove('ring-4', 'ring-emerald-400');
        }, 1800);
      }

      // Smooth auto-advance after 1.5s
      if (window.__cnNextTimer) clearTimeout(window.__cnNextTimer);
      window.__cnNextTimer = setTimeout(() => {
        actionNextChar();
      }, 1600);
    }

    // 7. INITIALIZATION ON PAGE LOAD
    window.addEventListener('DOMContentLoaded', () => {
      updateStarsDisplay();

      const urlParams = new URLSearchParams(window.location.search);
      const queryChar = urlParams.get('char');
      if (queryChar) {
        let found = false;
        for (let c = 0; c < CATEGORIES.length; c++) {
          const idx = CATEGORIES[c].chars.findIndex(i => i.char === queryChar);
          if (idx !== -1) {
            currentCategoryIndex = c;
            currentCharIndex = idx;
            currentCharObj = CATEGORIES[c].chars[idx];
            found = true;
            break;
          }
        }
        if (!found) {
          currentCharObj = {
            char: queryChar,
            py: '',
            th: 'อักษรจีน',
            strokes: '?',
            radical: queryChar,
            hint: 'ลากเส้นตามลำดับขีดที่แนะนำ'
          };
        }
      }

      renderCharShelf();
      updateHeaderInfo();
      setTimeout(initWriter, 120);
    });

    // Resize handler
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (writer) initWriter();
      }, 300);
    });
  </script>
